# Arasul Platform - PostgreSQL Custom Configuration
# Overrides the default postgresql.conf inside the Docker image.
# IMPORTANT: listen_addresses must be set explicitly since this replaces defaults.

# Network - allow connections from other containers
listen_addresses = '*'

# Extension preloading (pg_stat_statements for slow query analysis)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = top

# WAL Configuration
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# WAL-Archivierung (Plan 023 S5, eingeschaltet am 19.08.2026)
#
# Vorher aus. Ohne WAL gibt es keine Wiederherstellung auf einen Zeitpunkt,
# sondern nur auf 02:00 UTC des Vortags: bei einem Ausfall um 23:00 sind das
# 21 Stunden Arbeit. Die AVV-Vorlage sagte WAL-Archivierung zu, das Geraet
# lieferte 0 archivierte Segmente.
#
# Gepackt archiviert, nicht kopiert. Ein erzwungener Segmentwechsel schreibt
# sonst alle 15 Minuten volle 16 MB, auch wenn fast nichts drinsteht: 96
# Segmente am Tag sind 1,5 GB. Das waere mehr zusaetzliche Schreiblast, als
# PR #397 gerade eingespart hat (102 auf 8 bis 10 MB pro Minute). Gepackt sind
# leere Segmente wenige Kilobyte.
#
# `test ! -f` verhindert das Ueberschreiben eines bereits archivierten
# Segments. Schlaegt der Befehl fehl, wiederholt Postgres ihn, das ist so
# gewollt. Zurueckspielen mit
# `restore_command = 'gunzip -c /backups/wal/%f.gz > %p'`.
archive_mode = on
archive_command = 'test ! -f /backups/wal/%f.gz && gzip -c %p > /backups/wal/%f.gz'
# 15 Minuten begrenzen den moeglichen Datenverlust, ohne den Leerlauf zu fluten.
archive_timeout = 900

# Performance tuning for Jetson (ARM, NVMe SSD, 32-64GB unified memory)
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 64MB
maintenance_work_mem = 512MB

# WAL Performance
wal_compression = zstd
wal_buffers = 16MB

# Checkpoint tuning
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Autovacuum tuning (critical for long-running edge appliance)
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_autovacuum_min_duration = 1000
log_lock_waits = on
log_temp_files = 10MB
