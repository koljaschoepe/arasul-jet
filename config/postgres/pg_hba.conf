# =============================================================================
# pg_hba.conf der Plattform (J38, 02.10.2026)
# =============================================================================
# Wer sich mit welcher Datenbank verbinden darf. Gelesen wird von oben nach
# unten, die erste Zeile, die passt, gilt.
#
# Das Problem davor: jede App hat eine eigene Rolle `arasul_app_<id>_<stand>`
# mit eigener Datenbank, und `REVOKE CONNECT ... FROM PUBLIC` schliesst die
# Datenbanken der anderen Apps aus (`appDatenbank.sorgeFuer`). Die
# Plattform-Datenbank `arasul_db` aber ist fuer PUBLIC offen geblieben: eine App
# konnte sich mit ihrer Rolle dorthin verbinden. Diese Datei macht aus „vergessen
# zu schliessen" eine Regel, die fuer jede kuenftige App gleich gilt.
#
#   1. Eine App-Rolle darf nur in die Datenbank, die ihren Namen traegt.
#      `samerole` heisst: die Rolle ist Mitglied der Rolle, die so heisst wie
#      die Datenbank -- und jede Rolle ist Mitglied ihrer selbst. Rolle und
#      Datenbank einer App heissen gleich (`appDatenbank.namenFuer`).
#   2. Jede andere Verbindung einer App-Rolle wird abgewiesen, nicht zur
#      Passwortabfrage geschickt: `arasul_db`, `postgres`, `template1`, die
#      Datenbank einer anderen App.
#   3. Alles andere (die Dienste der Plattform) wie bisher mit Passwort.
#
# Warum nach dem NAMEN der Rolle und nicht nach der Adresse des Netzes: der
# Postgres haengt in zwei Netzen (`arasul-backend` und `arasul-apps`), und das
# Backend erreicht ihn je nach Namensaufloesung ueber das eine oder das andere.
# Eine Regel nach Adresse sperrte dann ab und zu die Plattform selbst aus.
# Der Praefix `arasul_app_` ist derselbe wie in `appDatenbank.PRAEFIX`; der
# Plattform-Nutzer `${POSTGRES_USER}` traegt ihn nicht.
#
# Die ersten sechs Zeilen sind die, die `initdb` im Image `postgres:16-alpine`
# selbst schreibt.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# J38
host    samerole        /^arasul_app_   all                     scram-sha-256
host    all             /^arasul_app_   all                     reject

host    all             all             all                     scram-sha-256
