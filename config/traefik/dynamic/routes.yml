# Traefik Dynamic Configuration - Routes
# All HTTP traffic is redirected to HTTPS via entrypoint config in traefik.yml
# All routers below use the 'websecure' entrypoint only

http:
  routers:
    # Dashboard Frontend (catch-all, lowest priority)
    dashboard-frontend:
      rule: 'PathPrefix(`/`)'
      service: dashboard-frontend-service
      priority: 1
      middlewares:
        # Bis zum 22.08.2026 stand hier nur `compress`. Der einzige Router
        # ohne Sicherheitskopfzeilen war ausgerechnet der, der dem Browser das
        # Dokument liefert. Begruendung bei `dokument-csp-bericht`.
        - security-headers-dokument
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Dashboard Backend API
    dashboard-api:
      rule: 'PathPrefix(`/api`)'
      service: dashboard-backend-service
      priority: 10
      middlewares:
        - security-headers
        - rate-limit-api
        - body-limit
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Streaming-Endpunkte (SSE) OHNE body-limit (Harness v2, 2026-07-30).
    # Traefiks buffering-Middleware (body-limit) puffert nicht nur Requests,
    # sondern hält auch die RESPONSE zurück — SSE kam dadurch erst als
    # End-Burst an ("der Lauf wirkt tot, dann steht alles auf einmal da").
    # Für die Stream-Pfade gilt deshalb ein eigener Router ohne buffering;
    # den Request-Größenschutz übernimmt dort das Express-JSON-Limit.
    #
    # Die KI-Brücke gehört seit dem 23.08.2026 dazu. Ihr `POST .../bruecke/llm`
    # streamt genauso, stand aber am allgemeinen `/api`-Router und damit hinter
    # `body-limit`. Auf dem Orin gemessen: direkt am Backend kam
    # `{"delta":"Paris"}` und `{"done":true}` an, über Traefik brach die
    # Verbindung sofort ab und das Backend meldete „socket hang up" —
    # die App zeigte nur „Fehler: LLM nicht erreichbar". Der Pfad enthält die
    # Erweiterungs-ID, deshalb `Path` mit benanntem Muster statt `PathPrefix`.
    dashboard-api-stream:
      rule: 'PathPrefix(`/api/llm`) || PathPrefix(`/api/rag`) || PathPrefix(`/api/document-analysis`) || PathPrefix(`/api/flows/laeufe`) || Path(`/api/extensions/{id:[^/]+}/bruecke/llm`)'
      service: dashboard-backend-service
      priority: 15
      middlewares:
        - security-headers
        - rate-limit-api
        - compress
      entryPoints:
        - websecure
      tls: {}

    # OpenAI-compatible API (/v1/chat/completions, /v1/embeddings, /v1/models)
    # Mounted at /v1 in dashboard-backend's app.js. API-key auth, no CSRF.
    dashboard-v1-openai:
      rule: 'PathPrefix(`/v1/chat`) || PathPrefix(`/v1/embeddings`) || PathPrefix(`/v1/models`)'
      service: dashboard-backend-service
      priority: 12
      middlewares:
        - security-headers
        - rate-limit-api
        - body-limit
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Auth endpoints (with stricter rate limiting)
    auth-api:
      rule: 'PathPrefix(`/api/auth`)'
      service: dashboard-backend-service
      priority: 20
      middlewares:
        - security-headers
        - rate-limit-auth
      entryPoints:
        - websecure
      tls: {}

    # Metrics API (with rate limiting)
    metrics-api:
      rule: 'PathPrefix(`/api/metrics`)'
      service: dashboard-backend-service
      priority: 15
      middlewares:
        - security-headers
        - rate-limit-metrics
        - compress
      entryPoints:
        - websecure
      tls: {}

    # LLM Service Direct Access (requires dashboard login)
    llm-direct:
      rule: 'PathPrefix(`/models`)'
      service: llm-service
      priority: 25
      middlewares:
        - forward-auth
        - strip-models-prefix
        - rate-limit-llm
        - security-headers
      entryPoints:
        - websecure
      tls: {}

    # Embeddings Service Direct Access (requires dashboard login)
    embeddings-direct:
      rule: 'PathPrefix(`/embeddings`)'
      service: embeddings-service
      priority: 25
      middlewares:
        - forward-auth
        - strip-embeddings-prefix
        - rate-limit-llm
        - security-headers
      entryPoints:
        - websecure
      tls: {}

    # Dashboard Frontend Static Files
    dashboard-static:
      rule: 'PathPrefix(`/static/js`) || PathPrefix(`/static/css`) || PathPrefix(`/static/media`)'
      service: dashboard-frontend-service
      priority: 65
      middlewares:
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Traefik Dashboard (secured with dashboard session auth)
    # SEC-FIX: Use forward-auth (dashboard session) instead of basicAuth with unset placeholder.
    # The dashboard API on port 8080 is already restricted to localhost in traefik.yml.
    #
    # `/dashboard` gehoerte hier NICHT hin (entfernt 2026-08-19): das Produkt
    # heisst "Arasul Dashboard", also ist /dashboard der Pfad, den ein Nutzer
    # als Erstes eintippt. Er landete auf api@internal und bekam Traefiks nackte
    # Textantwort "404 page not found" statt der gestalteten 404-Seite der App
    # — live geprueft, auch im eingeloggten Zustand. Traefiks eigenes Dashboard
    # funktionierte ueber diesen Pfad ohnehin nicht, weil der Prefix nicht
    # gestrippt wird. Der Pfad faellt jetzt an den Frontend-Catch-All.
    traefik-dashboard:
      rule: 'PathPrefix(`/api/traefik`)'
      service: api@internal
      priority: 35
      middlewares:
        - forward-auth
        - security-headers
        - rate-limit-auth
      entryPoints:
        - websecure
      tls: {}

  services:
    # Dashboard Frontend
    dashboard-frontend-service:
      loadBalancer:
        servers:
          - url: 'http://dashboard-frontend:3000'
        healthCheck:
          path: /
          interval: 30s
          timeout: 3s

    # Dashboard Backend
    dashboard-backend-service:
      loadBalancer:
        servers:
          - url: 'http://dashboard-backend:3001'
        healthCheck:
          path: /api/health
          interval: 10s
          timeout: 2s
        responseForwarding:
          # Flush SSE/streaming chunks immediately (was 100ms - caused visible latency)
          flushInterval: 1ms
        passHostHeader: true
        serversTransport: sse-transport

    # LLM Service (Ollama on port 11434)
    llm-service:
      loadBalancer:
        servers:
          - url: 'http://llm-service:11434'
        healthCheck:
          path: /api/tags
          interval: 30s
          timeout: 5s
        serversTransport: llm-transport

    # Embeddings Service
    embeddings-service:
      loadBalancer:
        servers:
          - url: 'http://embedding-service:11435'
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
