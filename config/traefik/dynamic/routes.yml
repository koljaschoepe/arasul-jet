# Traefik Dynamic Configuration - Routes
# All HTTP traffic is redirected to HTTPS via entrypoint config in traefik.yml
# All routers below use the 'websecure' entrypoint only

http:
  routers:
    # Dashboard Frontend (catch-all, lowest priority)
    dashboard-frontend:
      rule: 'PathPrefix(`/`)'
      service: dashboard-frontend-service
      priority: 1
      middlewares:
        # Bis zum 22.08.2026 stand hier nur `compress`. Der einzige Router
        # ohne Sicherheitskopfzeilen war ausgerechnet der, der dem Browser das
        # Dokument liefert. Begruendung bei `dokument-csp-bericht`.
        - security-headers-dokument
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Dashboard Backend API
    dashboard-api:
      rule: 'PathPrefix(`/api`)'
      service: dashboard-backend-service
      priority: 10
      middlewares:
        - security-headers
        - rate-limit-api
        - body-limit
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Streaming-Endpunkte (SSE) OHNE body-limit (Harness v2, 2026-07-30).
    # Traefiks buffering-Middleware (body-limit) puffert nicht nur Requests,
    # sondern hält auch die RESPONSE zurück — SSE kam dadurch erst als
    # End-Burst an ("der Lauf wirkt tot, dann steht alles auf einmal da").
    # Für die Stream-Pfade gilt deshalb ein eigener Router ohne buffering;
    # den Request-Größenschutz übernimmt dort das Express-JSON-Limit.
    #
    # Bis Phase B6 (26.08.2026) standen hier auch `/api/llm` (der Chat-Strom
    # der Oberfläche), `/api/rag`, `/api/document-analysis` und die KI-Brücke
    # der Erweiterungen; alle vier sind mit ihren Routen gefallen. Übrig ist
    # der Ereignis-Strom der Flow-Läufe.
    dashboard-api-stream:
      rule: 'PathPrefix(`/api/flows/laeufe`)'
      service: dashboard-backend-service
      priority: 15
      middlewares:
        - security-headers
        - rate-limit-api
        - compress
      entryPoints:
        - websecure
      tls: {}

    # OpenAI-compatible API (/v1/chat/completions, /v1/embeddings, /v1/models)
    # Mounted at /v1 in dashboard-backend's app.js. API-key auth, no CSRF.
    dashboard-v1-openai:
      rule: 'PathPrefix(`/v1/chat`) || PathPrefix(`/v1/embeddings`) || PathPrefix(`/v1/models`)'
      service: dashboard-backend-service
      priority: 12
      middlewares:
        - security-headers
        - rate-limit-api
        - body-limit
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Die zwei Proben jeder Seitenladung, vor dem Praefix darunter.
    #
    # Hoehere Prioritaet als `auth-api`, sonst faengt dessen `PathPrefix` sie
    # weg. Genau zwei Pfade, als `Path` und nicht als Praefix: was hier
    # steht, umgeht die strengere Drossel, und das soll nur, was jede
    # Seitenladung ohnehin fragt.
    auth-probe-api:
      rule: 'Path(`/api/auth/session`) || Path(`/api/auth/needs-setup`)'
      service: dashboard-backend-service
      priority: 25
      middlewares:
        - security-headers
        - rate-limit-auth-probe
      entryPoints:
        - websecure
      tls: {}

    # Auth endpoints (with stricter rate limiting)
    auth-api:
      rule: 'PathPrefix(`/api/auth`)'
      service: dashboard-backend-service
      priority: 20
      middlewares:
        - security-headers
        - rate-limit-auth
      entryPoints:
        - websecure
      tls: {}

    # Metrics API (with rate limiting)
    metrics-api:
      rule: 'PathPrefix(`/api/metrics`)'
      service: dashboard-backend-service
      priority: 15
      middlewares:
        - security-headers
        - rate-limit-metrics
        - compress
      entryPoints:
        - websecure
      tls: {}

    # LLM Service Direct Access (requires dashboard login)
    llm-direct:
      rule: 'PathPrefix(`/models`)'
      service: llm-service
      priority: 25
      middlewares:
        - forward-auth
        - strip-models-prefix
        - rate-limit-llm
        - security-headers
      entryPoints:
        - websecure
      tls: {}

    # Embeddings Service Direct Access (requires dashboard login)
    embeddings-direct:
      rule: 'PathPrefix(`/embeddings`)'
      service: embeddings-service
      priority: 25
      middlewares:
        - forward-auth
        - strip-embeddings-prefix
        - rate-limit-llm
        - security-headers
      entryPoints:
        - websecure
      tls: {}

    # Die Frontends der Apps (Phase C3, 27.08.2026).
    #
    # Arasul liefert sie selbst aus, nicht der Frontend-Container: nur das
    # Backend kennt die Anmeldung und damit die Frage, welche App wem
    # freigegeben ist (die Pruefung selbst kommt mit C4). Die Zahl liegt ueber
    # dem Catch-All des Dashboards (1) und UNTER den Routern der App-Backends,
    # die Docker-Labels mitbringen (`/apps/<id>/api` = 40, `/apps/<id>/test/api`
    # = 45, siehe services/app/appContainer.js). Ein App-Backend gewinnt damit
    # gegen die statische Auslieferung, und beide gewinnen gegen das Dashboard.
    apps-frontend:
      rule: 'PathPrefix(`/apps`)'
      service: dashboard-backend-service
      priority: 30
      middlewares:
        - security-headers-dokument
        - compress
      entryPoints:
        - websecure
      tls: {}

    # `/apps/<id>/api/me` gehoert der Plattform (Phase C4, 27.08.2026).
    #
    # Der eine Weg unter `api/`, den nicht der Container der App beantwortet,
    # sondern Arasul: „wer ist gerade angemeldet". Die Begruendung, warum er
    # der App weggenommen wird, steht bei `ICH` in
    # `apps/dashboard-backend/src/routes/appAusliefern.js` -- kurz: eine App
    # darf ganz ohne Backend auskommen, und dann gaebe es niemanden, der die
    # Frage beantworten koennte.
    #
    # `Path` und nicht `PathPrefix`: vergeben ist GENAU dieser Weg.
    # `/apps/urlaub/api/meine-antraege` gehoert weiter der App. Die Zahl liegt
    # ueber den Routern der App-Backends (40 live, 45 test, siehe
    # services/app/appContainer.js), sonst faenge der Container sie ab.
    #
    # ZWEI Router und nicht einer mit `||`: eine Regel mit einer Variablen ist
    # in Traefik v2 belegt (`Path(`/produkte/{id:[0-9]+}`)`), zwei Matcher mit
    # je einer Variablen in derselben Regel sind eine Wette darauf, wie Traefik
    # sie zusammenlegt. Der Preis dieser Vorsicht sind sechs Zeilen; der Preis
    # eines Irrtums waere ein Router, den Traefik verwirft, und damit eine
    # `/api/me`, die still im Container der App landet.
    #
    # Kein `forward-auth` davor: das Backend prueft die Freigabe hier selbst
    # (`appAusliefern.js` -> `services/app/appZugang.js`), so wie bei der
    # statischen Auslieferung darunter. Ein zweiter Weg fuer dieselbe Frage
    # waere ein zweiter Ort, an dem sie falsch beantwortet werden kann.
    apps-me:
      rule: 'Path(`/apps/{app:[a-z0-9-]+}/api/me`)'
      service: dashboard-backend-service
      priority: 50
      middlewares:
        - security-headers
        - rate-limit-api
        - compress
      entryPoints:
        - websecure
      tls: {}

    apps-me-test:
      rule: 'Path(`/apps/{app:[a-z0-9-]+}/test/api/me`)'
      service: dashboard-backend-service
      priority: 50
      middlewares:
        - security-headers
        - rate-limit-api
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Dashboard Frontend Static Files
    dashboard-static:
      rule: 'PathPrefix(`/static/js`) || PathPrefix(`/static/css`) || PathPrefix(`/static/media`)'
      service: dashboard-frontend-service
      priority: 65
      middlewares:
        - compress
      entryPoints:
        - websecure
      tls: {}

    # Traefik Dashboard (secured with dashboard session auth)
    # SEC-FIX: Use forward-auth (dashboard session) instead of basicAuth with unset placeholder.
    # The dashboard API on port 8080 is already restricted to localhost in traefik.yml.
    #
    # `/dashboard` gehoerte hier NICHT hin (entfernt 2026-08-19): das Produkt
    # heisst "Arasul Dashboard", also ist /dashboard der Pfad, den ein Nutzer
    # als Erstes eintippt. Er landete auf api@internal und bekam Traefiks nackte
    # Textantwort "404 page not found" statt der gestalteten 404-Seite der App
    # — live geprueft, auch im eingeloggten Zustand. Traefiks eigenes Dashboard
    # funktionierte ueber diesen Pfad ohnehin nicht, weil der Prefix nicht
    # gestrippt wird. Der Pfad faellt jetzt an den Frontend-Catch-All.
    traefik-dashboard:
      rule: 'PathPrefix(`/api/traefik`)'
      service: api@internal
      priority: 35
      middlewares:
        - forward-auth
        - security-headers
        - rate-limit-auth
      entryPoints:
        - websecure
      tls: {}

  services:
    # Dashboard Frontend
    dashboard-frontend-service:
      loadBalancer:
        servers:
          - url: 'http://dashboard-frontend:3000'
        healthCheck:
          path: /
          interval: 30s
          timeout: 3s

    # Dashboard Backend
    dashboard-backend-service:
      loadBalancer:
        servers:
          - url: 'http://dashboard-backend:3001'
        healthCheck:
          path: /api/health
          interval: 10s
          timeout: 2s
        responseForwarding:
          # Flush SSE/streaming chunks immediately (was 100ms - caused visible latency)
          flushInterval: 1ms
        passHostHeader: true
        serversTransport: sse-transport

    # LLM Service (Ollama on port 11434)
    llm-service:
      loadBalancer:
        servers:
          - url: 'http://llm-service:11434'
        healthCheck:
          path: /api/tags
          interval: 30s
          timeout: 5s
        serversTransport: llm-transport

    # Embeddings Service
    embeddings-service:
      loadBalancer:
        servers:
          - url: 'http://embedding-service:11435'
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
