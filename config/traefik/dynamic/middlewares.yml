# Traefik Dynamic Configuration - Middlewares
# Rate limiting, authentication, headers, etc.

http:
  middlewares:
    # Rate Limiting Middlewares

    # LLM API: 10 requests/second
    rate-limit-llm:
      rateLimit:
        average: 10
        period: 1s
        burst: 5

    # Metrics API: 20 requests/second
    rate-limit-metrics:
      rateLimit:
        average: 20
        period: 1s
        burst: 10

    # Auth endpoints: 30 requests/minute (prevent brute force while allowing normal use)
    # Previous: 5/15min was too restrictive, caused login failures
    # Note: Backend also has login attempt tracking in database for security
    #
    # Seit dem 29.08.2026 traegt sie nur noch, was sie meint: eine MUTATION
    # (Anmelden, Abmelden) und das Traefik-Dashboard. Die zwei Proben, die
    # jede Seitenladung macht, haben ihre eigene daneben -- warum, steht dort.
    rate-limit-auth:
      rateLimit:
        average: 30
        period: 1m
        burst: 10

    # Die zwei Proben jeder Seitenladung: 120 je Minute, wie im Backend.
    #
    # DIE ENGE DROSSEL WAR WIEDER EINE ANDERE (Phase G2, am Orin gemessen).
    # G1 hat `GET /api/auth/session` und `GET /api/auth/needs-setup` im
    # Backend von 30 auf 120 je Minute gehoben, mit dem Argument: eine
    # Seitenladung fragt beide, ein Buero teilt sich hinter NAT eine IP, und
    # 30 je Minute fuer die ganze Gruppe beantwortet eine Probe mit 429, deren
    # Zweck es ist, oft gestellt zu werden.
    #
    # Das Argument war richtig und blieb wirkungslos: HIER stand eine zweite,
    # strengere Drossel auf dem GANZEN Praefix `/api/auth`, und Traefik
    # antwortet, bevor das Backend die Anfrage sieht. Am 29.08.2026 gemessen:
    # nach eff 11 Anfragen auf `/api/auth/needs-setup` kam 429, waehrend das
    # Backend `ratelimit-remaining: 79 von 120` meldete. Eine Seitenladung
    # kostet zwei -- ein Buero war nach fuenf Seiten dicht.
    #
    # Und sie war UNSICHTBAR: Traefiks `rateLimit` schickt keine
    # `RateLimit-*`-Kopfzeilen. Die Abnahmen fuehren seit G1 Buch ueber jede
    # Drossel, die eine traegt, meldeten „nie auf eine Drossel gewartet" --
    # und wurden trotzdem rot. Am Koerper des 429 sind die beiden zu
    # unterscheiden: Traefik schickt `Too Many Requests` als Text, das
    # Backend JSON.
    #
    # `scripts/test/drosselzahlen.py` haelt diese Zahl an die des Backends.
    rate-limit-auth-probe:
      rateLimit:
        average: 120
        period: 1m
        burst: 40

    # General API: 100 requests/second
    rate-limit-api:
      rateLimit:
        average: 100
        period: 1s
        burst: 50

    # Security Headers
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        # HSTS: force browsers to use HTTPS for 2 years
        forceSTSHeader: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        customFrameOptionsValue: 'SAMEORIGIN'
        # Content-Security-Policy: restrict resource loading to same origin
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
        # Referrer-Policy: prevent leaking URLs to external services
        referrerPolicy: 'strict-origin-when-cross-origin'
        # Permissions-Policy: disable unnecessary browser features
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(), payment=()'
        customResponseHeaders:
          X-Powered-By: 'Arasul Platform'
          Server: '' # Hide server info

    # CORS Headers
    # PHASE1-FIX: Restricted to local/private networks instead of wildcard "*"
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - 'http://localhost'
          - 'http://localhost:3000'
          - 'http://127.0.0.1'
          - 'http://127.0.0.1:3000'
          - 'https://localhost'
          - 'https://127.0.0.1'
        accessControlAllowOriginListRegex:
          - "^https?://192\\.168\\.[0-9]+\\.[0-9]+(:[0-9]+)?$"
          - "^https?://10\\.[0-9]+\\.[0-9]+\\.[0-9]+(:[0-9]+)?$"
          - "^https?://172\\.(1[6-9]|2[0-9]|3[0-1])\\.[0-9]+\\.[0-9]+(:[0-9]+)?$"
        accessControlAllowHeaders:
          - 'Content-Type'
          - 'Authorization'
          - 'X-Requested-With'
        accessControlExposeHeaders:
          - 'Content-Length'
          - 'Content-Type'
        accessControlMaxAge: 3600
        addVaryHeader: true

    # Forward Authentication (JWT validation via cookie or header)
    forward-auth:
      forwardAuth:
        address: 'http://dashboard-backend:3001/api/auth/verify'
        authRequestHeaders:
          - 'Authorization'
          - 'Cookie'
        authResponseHeaders:
          - 'X-User-Id'
          - 'X-User-Name'
          - 'X-User-Email'

    # Sicherheitskopfzeilen fuer das DOKUMENT (Fund 22.08.2026).
    #
    # Der Router `dashboard-frontend` trug als einziger keine
    # Sicherheitskopfzeilen. Ausgerechnet der, denn eine
    # Content-Security-Policy auf einer JSON-Antwort schuetzt fast nichts, auf
    # der Seite, die der Browser als Dokument laedt, dagegen alles.
    # Nachgemessen am Geraet: `curl -D- https://localhost/` lieferte nur
    # `x-content-type-options` und `x-frame-options`, sonst nichts.
    #
    # Auch das nginx im Frontend-Container liefert seine eigene Policy nicht
    # aus: `location = /index.html` und der Asset-Block setzen jeweils eigene
    # `add_header`, und nginx ERSETZT damit den geerbten Satz, statt ihn zu
    # ergaenzen. Zwei voneinander unabhaengige Gruende fuer dieselbe Luecke.
    #
    # Warum das hier steht und nicht einfach `security-headers` benutzt wird:
    # jene Middleware traegt eine andere Policy, ohne `worker-src` und ohne
    # `media-src`. Der PDF-Betrachter laedt seinen Worker ueber eine
    # blob:-URL, und die Anlagen im Chat sind Blobs.
    #
    # Die Policy war zuerst BERICHTEND, weil die Anwendung noch nie unter einer
    # gelaufen war. Am 22.08.2026 auf dem Orin gemessen (damals
    # `scripts/test/csp-abnahme.mjs`, seit Phase D6 in
    # `scripts/test/oberflaeche-abnahme.mjs`):
    # genau EIN Verstoss im ganzen Durchlauf, und zwar eine Bibliothek, die
    # mit `new Function("")` FRAGT, ob sie kompilieren darf, und den Fehler
    # abfaengt. Unter einer scharfen Policy lautet die Antwort Nein, und mehr
    # passiert nicht. Der Betrachter zeichnete dabei drei Leinwaende.
    #
    # KEIN `unsafe-eval`. Das war der Grund fuer die Messung, und es bleibt
    # dabei: pdf.js bekommt vom Frontend ohnehin `isEvalSupported: false`.
    security-headers-dokument:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        customFrameOptionsValue: 'SAMEORIGIN'
        referrerPolicy: 'strict-origin-when-cross-origin'
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(), payment=()'
        customResponseHeaders:
          X-Powered-By: 'Arasul Platform'
          Server: ''
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

    strip-models-prefix:
      stripPrefix:
        prefixes:
          - '/models'
        forceSlash: false

    strip-embeddings-prefix:
      stripPrefix:
        prefixes:
          - '/embeddings'
        forceSlash: false

    # Request Body Size Limit (50MB — prevents DoS via oversized uploads)
    body-limit:
      buffering:
        maxRequestBodyBytes: 52428800

    # Compression
    compress:
      compress:
        excludedContentTypes:
          - 'text/event-stream'
          - 'application/grpc'

    # IP Whitelist (for admin routes - available for future use)
    admin-whitelist:
      ipWhiteList:
        sourceRange:
          - '127.0.0.1/32'
          - '172.30.0.0/24' # Docker network
          - '192.168.0.0/16' # Local network
          - '10.0.0.0/8' # Private network

    # The Traefik dashboard is protected by forward-auth (dashboard session),
    # see routes.yml. The old basicAuth-traefik middleware and its
    # __BASIC_AUTH_HASH__ bootstrap placeholder were unused and have been removed.

  # Servers transports for SSE streams (extended timeout)
  serversTransports:
    sse-transport:
      forwardingTimeouts:
        responseHeaderTimeout: 600s
        idleConnTimeout: 600s

    # LLM inference can take up to 5 minutes for long outputs
    llm-transport:
      forwardingTimeouts:
        responseHeaderTimeout: 300s
        idleConnTimeout: 300s
