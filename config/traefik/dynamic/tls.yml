# Traefik TLS - das Zertifikat dieses Geraets
#
# Die Dateien legt scripts/security/geraete-zertifikat.sh an: eine Geraete-CA,
# die einmal im Leben des Geraets entsteht, und ein von ihr ausgestelltes
# Zertifikat auf den Netznamen, `<name>.local`, `localhost` und jede IP des
# Geraets. `arasul.crt` traegt beides, Zertifikat und CA, in dieser Reihenfolge.
#
# Diese Datei wird NICHT mehr erzeugt, sondern gepflegt (Phase C10,
# 27.08.2026). Vorher schrieb das Zertifikatsskript sie bei jedem Lauf neu, mit
# einem Inhalt, der Zeichen fuer Zeichen dem hier entsprach; wer hier etwas
# aenderte, verlor es beim naechsten Zertifikat.

tls:
  certificates:
    - certFile: /etc/traefik/certs/arasul.crt
      keyFile: /etc/traefik/certs/arasul.key
      stores:
        - default

  stores:
    default:
      # Was ein Client bekommt, der KEINEN Namen nennt. Ein Browser auf
      # `https://192.168.1.50/` schickt keine SNI-Erweiterung, weil eine IP
      # kein Name ist; ohne diesen Eintrag haette Traefik an dieser Stelle
      # nichts anzubieten. Das Zertifikat traegt die IPs des Geraets als
      # Subject Alternative Name, der Weg ueber die IP ist damit vollstaendig.
      defaultCertificate:
        certFile: /etc/traefik/certs/arasul.crt
        keyFile: /etc/traefik/certs/arasul.key

  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      # X25519 und P-256 standen bis zum 27.08.2026 nicht in dieser Liste, nur
      # P-521 und P-384. Jeder Browser bietet zuerst X25519 an; der Server
      # musste deshalb bei JEDEM Verbindungsaufbau eine zweite Runde verlangen
      # (HelloRetryRequest) und die Verbindung kostete eine Umlaufzeit mehr.
      # Ein Client, der ausser X25519 und P-256 nichts kann, kam gar nicht
      # durch. Die Reihenfolge bleibt: das Beste zuerst.
      curvePreferences:
        - CurveP521
        - CurveP384
        - CurveP256
        - X25519
      # `false`, und das ist hier keine Nachlaessigkeit: mit `true` lehnt
      # Traefik jede Verbindung ohne SNI ab, also genau den Aufruf ueber die
      # IP-Adresse. Im Firmennetz ist die IP der erste Weg, den ein Admin
      # probiert, wenn der Name noch nicht aufloest.
      sniStrict: false
