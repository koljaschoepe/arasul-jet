# Traefik Static Configuration for Arasul Platform
# Main configuration file

# Global settings
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: false # Dashboard only via authenticated route

# Ping endpoint for health checks
ping:
  entryPoint: traefik

# Entrypoints
entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ':443'
    http:
      tls: {} # Uses self-signed cert from tls.yml

  # Der Firmenordner (J33, 22.09.2026) — ein EIGENER Einstiegspunkt.
  #
  # WARUM NICHT EIN PFAD AUF 443. OpenCloud stammt von ownCloud Infinite Scale
  # ab und laeuft nur auf einer WURZEL: seine Oberflaeche, sein Anmeldedienst
  # und seine WebDAV-Wege rechnen alle mit `/` und nicht mit `/firmenordner/`.
  # Ein Praefix davorzulegen hiesse, in jeder Antwort Pfade umzuschreiben.
  #
  # WARUM NICHT EIN ZWEITER HOSTNAME. Der braeuchte einen DNS-Eintrag im
  # Kundennetz und ein neues Geraetezertifikat mit diesem Namen darin. Ein
  # zweiter PORT braucht keins von beidem: das Zertifikat aus der Geraete-CA
  # traegt `arasul`, `arasul.local`, `localhost` und jede IP des Geraets schon,
  # und es gilt hier genauso wie auf 443 (der Speicher `default` aus
  # `dynamic/tls.yml` haengt nicht am Einstiegspunkt).
  #
  # UND ES MACHT DIE GRENZE SAGBAR. „Ein Gast im Netz erreicht den
  # Firmenordner, aber nicht die Apps" ist mit zwei Ports eine Regel in der
  # Firewall; mit einem Port waere es eine Regel ueber Pfade.
  firmenordner:
    address: ':8443'
    http:
      tls: {}

  # Traefik dashboard
  traefik:
    address: ':8080'

# TLS: Self-signed certificates configured in dynamic/tls.yml
# Let's Encrypt disabled: arasul.local is a LAN-only domain

# Providers
providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false # Only expose services with labels
    network: arasul-backend
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: INFO
  filePath: /arasul/logs/traefik.log
  format: json

# Access logs
accessLog:
  filePath: /arasul/logs/traefik-access.log
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - '400-599' # Only log errors
    retryAttempts: true
    minDuration: '100ms' # Only log slow requests

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.0
      - 3.0
      - 5.0

# Tracing (optional, for debugging)
# tracing:
#   serviceName: traefik
#   spanNameLimit: 150

# Pilot (disabled)
pilot:
  dashboard: false
