# Arasul Platform - Docker Secrets
# Mounts secret files into containers at /run/secrets/<name>
# Services read via _FILE env vars (resolveSecrets.js / native support)
#
# SECRETS_PFAD ist die siebte Trennung des Pruefstands (compose/pruefstand.vars).
# Ohne sie teilen sich beide Stacks dieselben Geheimnisdateien, und zwei Dinge
# gehen schief:
#
#   1. Der Fabrikzustand ist keiner. `admin_password` liegt auch im
#      "frischen" Pruefstand, bootstrap.js legt daraus einen Administrator an,
#      und die Frischgeraet-Abnahme findet ein Konto ab Werk vor. Genau so am
#      23.08.2026 gemessen. Das Entwerten in der .env reicht nicht, dieselbe
#      Zeichenkette kommt als Docker-Secret herein (bootstrap.js, Fund vom
#      19.08.2026).
#   2. Ein Werksreset auf dem Pruefstand faende die echten Geheimnisse vor.
#
# Die Vorgabe ist der bisherige Pfad, der Normalbetrieb aendert sich also
# nicht. Gegengeprueft mit `docker compose config`: vor und nach dieser
# Aenderung dieselbe Ausgabe.

secrets:
  postgres_password:
    file: ${SECRETS_PFAD:-../config/secrets}/postgres_password
  jwt_secret:
    file: ${SECRETS_PFAD:-../config/secrets}/jwt_secret
  n8n_encryption_key:
    file: ${SECRETS_PFAD:-../config/secrets}/n8n_encryption_key
  # Gemeinsames Auth-Token zwischen n8n (Task-Broker) und n8n-runners
  # (task-runner-launcher). Generiert von scripts/interactive_setup.sh bzw.
  # ./arasul bootstrap (setup_secrets) — nie committen.
  n8n_runners_auth_token:
    file: ${SECRETS_PFAD:-../config/secrets}/n8n_runners_auth_token
  # Fester n8n-Owner (Plan 007): Zugangsdaten des einzigen n8n-Owners, der beim
  # Container-Start idempotent provisioniert wird (services/n8n/entrypoint.sh)
  # und über den das Backend (routes/automations.js) die n8n-Session herstellt.
  # Generiert von scripts/interactive_setup.sh bzw. ./arasul bootstrap
  # (setup_secrets) — nie committen.
  n8n_owner_email:
    file: ${SECRETS_PFAD:-../config/secrets}/n8n_owner_email
  n8n_owner_password:
    file: ${SECRETS_PFAD:-../config/secrets}/n8n_owner_password
  admin_password:
    file: ${SECRETS_PFAD:-../config/secrets}/admin_password
  # Plan 023 S3: Schluessel fuer AES-256 auf den taeglichen Sicherungen. Erzeugt
  # von scripts/interactive_setup.sh bzw. ./arasul bootstrap (setup_secrets).
  # Ein Wechsel macht jede aeltere Sicherung unlesbar.
  backup_encryption_key:
    file: ${SECRETS_PFAD:-../config/secrets}/backup_encryption_key

services:
  postgres-db:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  dashboard-backend:
    secrets:
      - postgres_password
      - jwt_secret
      - admin_password
      # n8n-Owner-Zugangsdaten: das Backend meldet den festen Owner bei n8n an
      # (GET /api/automations/session), um die n8n-Session herzustellen.
      - n8n_owner_email
      - n8n_owner_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      N8N_OWNER_EMAIL_FILE: /run/secrets/n8n_owner_email
      N8N_OWNER_PASSWORD_FILE: /run/secrets/n8n_owner_password

  metrics-collector:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  self-healing-agent:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  backup-service:
    secrets:
      - postgres_password
      - n8n_encryption_key # for the daily key-escrow alongside the DB dump
      - backup_encryption_key # Plan 023 S3
    environment:
      # Plan 023 S3. Stand 19.08.2026 meldete backup_report.json
      # "encrypted": "false", waehrend die AVV-Vorlage AES-256 zusagte.
      # Voraussetzung dafuer war S2: der Wiederherstellungstest muss
      # entschluesseln koennen, sonst schlaegt er ab hier dauerhaft fehl.
      BACKUP_ENCRYPT: ${BACKUP_ENCRYPT:-true}
      BACKUP_ENCRYPT_KEY_FILE: /run/secrets/backup_encryption_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Without N8N_ENCRYPTION_KEY in the escrow, a Postgres dump is useless
      # for restoring n8n credentials. backup.sh writes a copy alongside the
      # daily snapshot when BACKUP_ENCRYPT=true (refuses without encryption).
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key

  n8n:
    secrets:
      - n8n_encryption_key
      - n8n_runners_auth_token
      - postgres_password
      # Fester Owner (Plan 007): entrypoint.sh provisioniert ihn idempotent.
      - n8n_owner_email
      - n8n_owner_password
    environment:
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      # Aufgelöst von services/n8n/entrypoint.sh (n8n selbst versteht die
      # *_FILE-Konvention für diese Variable nicht).
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password
      # Owner-Provisionierung durch services/n8n/entrypoint.sh (POST /rest/owner/setup).
      N8N_OWNER_EMAIL_FILE: /run/secrets/n8n_owner_email
      N8N_OWNER_PASSWORD_FILE: /run/secrets/n8n_owner_password

  n8n-runners:
    secrets:
      - n8n_runners_auth_token
    environment:
      # Der task-runner-launcher versteht die *_FILE-Konvention nativ.
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
