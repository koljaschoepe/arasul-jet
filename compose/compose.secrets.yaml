# Arasul Platform - Docker Secrets
# Mounts secret files into containers at /run/secrets/<name>
# Services read via _FILE env vars (resolveSecrets.js / native support)
#
# SECRETS_PFAD ist die siebte Trennung des Pruefstands (compose/pruefstand.vars).
# Ohne sie teilen sich beide Stacks dieselben Geheimnisdateien, und zwei Dinge
# gehen schief:
#
#   1. Der Fabrikzustand ist keiner. `admin_password` liegt auch im
#      "frischen" Pruefstand, bootstrap.js legt daraus einen Administrator an,
#      und die Frischgeraet-Abnahme findet ein Konto ab Werk vor. Genau so am
#      23.08.2026 gemessen. Das Entwerten in der .env reicht nicht, dieselbe
#      Zeichenkette kommt als Docker-Secret herein (bootstrap.js, Fund vom
#      19.08.2026).
#   2. Ein Werksreset auf dem Pruefstand faende die echten Geheimnisse vor.
#
# Die Vorgabe ist der bisherige Pfad, der Normalbetrieb aendert sich also
# nicht. Gegengeprueft mit `docker compose config`: vor und nach dieser
# Aenderung dieselbe Ausgabe.

secrets:
  postgres_password:
    file: ${SECRETS_PFAD:-../config/secrets}/postgres_password
  jwt_secret:
    file: ${SECRETS_PFAD:-../config/secrets}/jwt_secret
  admin_password:
    file: ${SECRETS_PFAD:-../config/secrets}/admin_password
  # Plan 023 S3: Schluessel fuer AES-256 auf den taeglichen Sicherungen. Erzeugt
  # von scripts/interactive_setup.sh bzw. ./arasul bootstrap (setup_secrets).
  # Ein Wechsel macht jede aeltere Sicherung unlesbar.
  backup_encryption_key:
    file: ${SECRETS_PFAD:-../config/secrets}/backup_encryption_key

services:
  postgres-db:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  dashboard-backend:
    secrets:
      - postgres_password
      - jwt_secret
      - admin_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # Der Firmenordner (J33, 22.09.2026) -- und als EINZIGES Geheimnis hier
      # KEIN Docker-Secret, sondern ein Pfad in dem `config/`-Mount, den der
      # Backend-Container ohnehin hat.
      #
      # DER GRUND IST EIN AUSFALLRISIKO, KEIN GESCHMACK. Ein `secrets:`-Eintrag
      # verlangt die Datei, sobald der Container angelegt wird -- auf JEDEM
      # Geraet, auch auf einem ohne Firmenordner. Ein Geraet, das dieses
      # Artefakt einspielt und die Datei nicht hat, bekaeme also kein Backend
      # mehr. Ueber den Pfad ist eine fehlende Datei genau das, was sie sein
      # soll: `resolveSecrets` findet nichts, der Wert bleibt leer, und
      # `GET /api/firmenordner` sagt mit einem Satz, was fehlt.
      #
      # Der Dateidienst selbst liest dieselbe Datei (`compose.firmenordner.yaml`),
      # dort ueber `SECRETS_PFAD`. Hier steht der Pfad IM Container, und der
      # ist fest, weil `../config:/config:ro` fest ist. Auf dem Pruefstand
      # (eigener `SECRETS_PFAD`, siehe Kopf dieser Datei) zeigen die beiden
      # damit auf verschiedene Dateien -- dort laeuft aber kein Firmenordner,
      # und wer ihn dort haben will, setzt `CONFIG_PFAD` mit.
      FIRMENORDNER_ADMIN_PASSWORT_FILE: /config/secrets/firmenordner_admin_password

  metrics-collector:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  self-healing-agent:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  backup-service:
    secrets:
      - postgres_password
      - backup_encryption_key # Plan 023 S3
    environment:
      # Plan 023 S3. Stand 19.08.2026 meldete backup_report.json
      # "encrypted": "false", waehrend die AVV-Vorlage AES-256 zusagte.
      # Voraussetzung dafuer war S2: der Wiederherstellungstest muss
      # entschluesseln koennen, sonst schlaegt er ab hier dauerhaft fehl.
      BACKUP_ENCRYPT: ${BACKUP_ENCRYPT:-true}
      BACKUP_ENCRYPT_KEY_FILE: /run/secrets/backup_encryption_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
