# Arasul Platform - Application Services
# Dashboard Backend, Dashboard Frontend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '10'

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # 1. Dashboard Backend
  dashboard-backend:
    build:
      context: ..
      dockerfile: apps/dashboard-backend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: ${CONTAINER_PREFIX:-}dashboard-backend
    hostname: dashboard-backend
    restart: always
    networks:
      - arasul-frontend
      - arasul-backend
      - arasul-monitoring
      - arasul-docker-proxy
    group_add:
      # P6.6: docker GID — defaults to 994 (Jetson default), override via env.
      - '${DOCKER_GID:-994}'
    environment:
      NODE_ENV: production
      # Flow-Zeitpläne (cronExpr) rechnen in Prozess-Lokalzeit; ohne TZ läuft der
      # Container in UTC und „täglich 8 Uhr" feuert um 10 Uhr deutscher Zeit.
      TZ: ${TZ:-Europe/Berlin}
      PORT: ${DASHBOARD_BACKEND_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      LLM_SERVICE_HOST: ${LLM_SERVICE_HOST}
      LLM_SERVICE_PORT: ${LLM_SERVICE_PORT}
      # Chat-Agent Harness v2 (services/llm/agentConfig.js) — ohne diese
      # Durchreichung erreichen .env-Werte den Container NIE (stiller Default).
      AGENT_NUM_CTX: ${AGENT_NUM_CTX:-32768}
      AGENT_NUM_PREDICT: ${AGENT_NUM_PREDICT:--1}
      AGENT_KEEP_ALIVE: ${AGENT_KEEP_ALIVE:-30m}
      AGENT_QUALITAETS_MODELL: ${AGENT_QUALITAETS_MODELL:-}
      AGENT_THINKING: ${AGENT_THINKING:-an}
      AGENT_MAX_SUBAGENTEN: ${AGENT_MAX_SUBAGENTEN:-8}
      AGENT_PLAN_TOKENS_GROSS: ${AGENT_PLAN_TOKENS_GROSS:-2048}
      AGENT_PLAN_TOKENS_KLEIN: ${AGENT_PLAN_TOKENS_KLEIN:-512}
      AGENT_VERLAUF_TOKEN_BUDGET: ${AGENT_VERLAUF_TOKEN_BUDGET:-1200}
      # Wie lange eine Modell-Runde stumm bleiben darf, bevor der Lauf als tot
      # gilt (Plan 023 E1). Stand bisher in der Dokumentation und im Code, aber
      # nicht hier, war also auf einem ausgelieferten Geraet nicht einstellbar.
      FLOW_LLM_TIMEOUT_MS: ${FLOW_LLM_TIMEOUT_MS:-120000}
      # Zwei Zahlen, weil es zwei verschiedene Dinge sind: oben die
      # erlaubte Stille zwischen zwei Zeichen im Chat, hier das
      # Zeitlimit eines ganzen, nicht gestreamten Flow-Aufrufs
      # (services/flows/toolLoop.js).
      FLOW_LLM_AUFRUF_TIMEOUT_MS: ${FLOW_LLM_AUFRUF_TIMEOUT_MS:-300000}
      # Und wie lange VOR dem ersten Wort einer Runde, waehrend Modellladung
      # und Vorverarbeitung laufen. Grosszuegiger, weil das bei vollem
      # Zusammenhang auf dem Jetson gemessen bis zu zwei Minuten dauert.
      FLOW_LLM_VORLAUF_TIMEOUT_MS: ${FLOW_LLM_VORLAUF_TIMEOUT_MS:-300000}
      # Plan 023 I3: wie lange ein Flow auf eine Rueckfrage-Antwort wartet.
      FLOW_RUECKFRAGE_TIMEOUT_MS: ${FLOW_RUECKFRAGE_TIMEOUT_MS:-}
      # Externe Cloud-Modelle (Plan 023 D9).
      EXTERN_TIMEOUT_MS: ${EXTERN_TIMEOUT_MS:-60000}
      EXTERN_MODELLE_CACHE_MS: ${EXTERN_MODELLE_CACHE_MS:-300000}
      EMBEDDING_SERVICE_HOST: ${EMBEDDING_SERVICE_HOST}
      EMBEDDING_SERVICE_PORT: ${EMBEDDING_SERVICE_PORT}
      # Plan 023 J3: wo die eingehaengten Datentraeger IM Container liegen.
      EXTERNE_MEDIEN_DIR: ${EXTERNE_MEDIEN_DIR:-/arasul/medien}
      DOCUMENT_INDEXER_HOST: ${DOCUMENT_INDEXER_HOST:-document-indexer}
      DOCUMENT_INDEXER_API_PORT: ${DOCUMENT_INDEXER_API_PORT:-9102}
      # Der Start wartet auf eine noch nicht erreichbare Datenbank. Postgres
      # faehrt bei einer FRISCHEN Datenbank zweimal hoch, und der
      # Healthcheck kann in der ersten Phase schon gruen sein
      # (src/bootstrap.js).
      BOOTSTRAP_DB_VERSUCHE: ${BOOTSTRAP_DB_VERSUCHE:-10}
      BOOTSTRAP_DB_WARTE_MS: ${BOOTSTRAP_DB_WARTE_MS:-3000}
      JWT_EXPIRY: ${JWT_EXPIRY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      # Leer statt Warnung: ungesetzt ist der Normalfall, siehe .env.example.
      SYSTEM_VERSION: ${SYSTEM_VERSION:-}
      BUILD_HASH: ${BUILD_HASH}
      LOG_LEVEL: ${LOG_LEVEL}
      # Shared secret for the /api/events/webhook/self-healing endpoint. When set,
      # callers must send a matching x-webhook-secret header (defense-in-depth on
      # top of the LAN IP allowlist). Generated per box in .env.
      SELF_HEALING_WEBHOOK_SECRET: ${SELF_HEALING_WEBHOOK_SECRET:-}
      RAG_ENABLE_MULTI_QUERY: 'false'
      RAG_ENABLE_HYDE: 'false'
      RAG_ENABLE_DECOMPOUND: 'true'
      RAG_ENABLE_RERANKING: 'true'
      RAG_QUERY_OPTIMIZER_MODEL: ''
      ENV_FILE_PATH: /arasul/config/.env
      # LAN mDNS hostname (without .local). Lets /api/system/network report the
      # real access name instead of a hardcoded "arasul.local" when a customer
      # runs a custom hostname. Defaults to "arasul".
      MDNS_NAME: ${MDNS_NAME:-arasul}
      COMPOSE_PROJECT_DIR: ${COMPOSE_PROJECT_DIR:-.}
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_NETWORK: arasul-platform_arasul-backend
    volumes:
      # Sechste Trennung fuer den Pruefstand (siehe compose/pruefstand.vars):
      # der Werksreset SCHREIBT in diese Datei, er entwertet ADMIN_PASSWORD.
      # Ohne eigene Datei wuerde ein Reset auf dem Pruefstand das Erstpasswort
      # des Normalbetriebs mit entwerten.
      - ${ENV_DATEI:-../.env}:/arasul/config/.env
      - ../config:/config:ro
      # JetPack-Version: dpkg-query fragt ein HOST-Paket ab und schlaegt im
      # Container immer fehl. Ohne diesen Mount zeigt die Einstellungsseite
      # dauerhaft "unknown". Die Datei existiert nur auf Jetson-Hosts, deshalb
      # steht in der Compose-Ebene ein Default-Pfad, der auch leer sein darf.
      - ${NV_TEGRA_RELEASE:-/etc/nv_tegra_release}:/etc/nv_tegra_release:ro
      - ${DATA_PATH:-../data}/updates:/arasul/updates
      - ${DATA_PATH:-../data}/backups:/arasul/backups:ro
      - ${DATA_PATH:-../data}/appstore/manifests:/arasul/appstore/manifests:ro
      - ${DATA_PATH:-../data}/ssh-keys:/arasul/ssh-keys:ro
      - ../services/postgres/init:/arasul/migrations:ro
      # Flow-Definitionen (Plan 011): bewusst ein eigener Pfad, getrennt vom
      # Nutzer-Workspace — ein Flow mit Schreibrecht kann seine eigene
      # Definition damit nicht ueberschreiben. Schreibbar, weil der Anlege-
      # Dialog hier Dateien erzeugt; ueberlebt Rebuilds und wandert ins Backup.
      - ${DATA_PATH:-../data}/flows:/arasul/flows
      # Projektablage: ein echter Geraete-Ordner je Projekt (/arasul/projects/
      # <uuid>) — Datei-API des Explorers, Arbeitsverzeichnis fuer Flows,
      # Mount fuer Sandboxes. Auch der Git-Sync-Checkout (PROJECT_GIT_DIR)
      # liegt hier; ueberlebt Rebuilds und wandert ins Backup.
      - ${DATA_PATH:-../data}/projects:/arasul/projects
      # Angesteckte Datentraeger (Plan 023 J3). Der Host haengt sie unter
      # /media/<nutzer>/<name> ein; der Container sieht GENAU diese Ordner und
      # sonst nichts vom Host. Einhaengen bleibt Sache des Betriebssystems.
      # Fehlt der Pfad auf dem Host, ist der Mount leer und die Oberflaeche
      # sagt das; sie zeigt keinen Fehler.
      - ${EXTERNE_MEDIEN:-/media/arasul}:/arasul/medien
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres-db:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_DASHBOARD:-4}'
          memory: ${RAM_LIMIT_BACKEND:-1G}
          pids: 256
    stop_grace_period: 35s
    labels:
      - 'traefik.enable=false'
    logging: *default-logging

  # 2. Dashboard Frontend
  dashboard-frontend:
    build:
      context: ..
      dockerfile: apps/dashboard-frontend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: ${CONTAINER_PREFIX:-}dashboard-frontend
    hostname: dashboard-frontend
    restart: always
    networks:
      - arasul-frontend
    depends_on:
      dashboard-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32M
      - /var/cache/nginx:size=32M
      - /run:size=8M
    <<: *default-security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - 'traefik.enable=false'
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: ${RAM_LIMIT_FRONTEND:-256M}
          pids: 64
