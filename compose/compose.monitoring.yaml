# Arasul Platform - Monitoring & Operations
# Metrics Collector, Self-Healing Agent, Backup Service
#
# Loki und Promtail sind am 26.08.2026 (Phase B4 des Rueckbaus) entfallen:
# kein Leser, die Log-Ansicht des Dashboards liest Docker direkt.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '10'

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # 1. Metrics Collector
  metrics-collector:
    build:
      context: ..
      dockerfile: services/metrics-collector/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11.12}
    container_name: ${CONTAINER_PREFIX:-}metrics-collector
    hostname: metrics-collector
    restart: always
    networks:
      - arasul-backend
      - arasul-monitoring
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD resolved via Docker secret (compose.secrets.yaml)
      POSTGRES_DB: ${POSTGRES_DB}
      METRICS_INTERVAL_LIVE: ${METRICS_INTERVAL_LIVE:-5}
      METRICS_INTERVAL_PERSIST: ${METRICS_INTERVAL_PERSIST:-60}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /dev:/host/dev:ro
      - arasul-metrics:/cache
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9100/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    <<: *default-security
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${RAM_LIMIT_METRICS:-512M}
          pids: 100
    logging: *default-logging

  # 2. Self-Healing Engine
  self-healing-agent:
    build:
      context: ..
      dockerfile: services/self-healing-agent/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11.12}
    container_name: ${CONTAINER_PREFIX:-}self-healing-agent
    hostname: self-healing-agent
    restart: always
    networks:
      - arasul-backend
      - arasul-monitoring
      - arasul-docker-proxy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD resolved via Docker secret (compose.secrets.yaml)
      POSTGRES_DB: ${POSTGRES_DB}
      SELFHEAL_COMPOSE_PROJECT: ${SELFHEAL_COMPOSE_PROJECT:-}
      SELF_HEALING_INTERVAL: ${SELF_HEALING_INTERVAL}
      SELF_HEALING_ENABLED: ${SELF_HEALING_ENABLED}
      LOG_LEVEL: ${SELF_HEALING_LOG_LEVEL}
      METRICS_COLLECTOR_HOST: metrics-collector
      METRICS_COLLECTOR_PORT: 9100
      DISK_WARNING_PERCENT: ${DISK_WARNING_PERCENT}
      DISK_CLEANUP_PERCENT: ${DISK_CLEANUP_PERCENT}
      DISK_CRITICAL_PERCENT: ${DISK_CRITICAL_PERCENT}
      DISK_REBOOT_PERCENT: ${DISK_REBOOT_PERCENT}
      HEARTBEAT_PORT: ${SELF_HEALING_HEARTBEAT_PORT:-9200}
      EXCLUDED_CONTAINERS: ''
      DOCKER_HOST: tcp://docker-proxy:2375
      # Der Netzname steht im erneuerten Zertifikat. Ohne ihn faellt die
      # Erneuerung auf "arasul" zurueck, und ein Kunde mit eigenem Namen haette
      # nach der Erneuerung ein Zertifikat auf einen fremden Namen (Phase C10).
      MDNS_NAME: ${MDNS_NAME:-arasul}
    volumes:
      - ${LOGS_PATH:-../logs}:/arasul/logs
      # Das Zertifikat des Geraets und der Schluessel seiner CA. SCHREIBBAR:
      # dieser Dienst stellt es neu aus, sobald weniger als 60 Tage bleiben
      # (`check_tls_cert_expiry`). Bis Phase C10 war der Ordner hier nicht
      # eingehaengt und die Erneuerung damit wirkungslos.
      - ../config/traefik/certs:/arasul/config/traefik/certs
      - ../scripts/security:/arasul/scripts/security:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /media:/media:ro
      - /mnt:/mnt:ro
      - ${DATA_PATH:-../data}/updates:/arasul/updates
      - ${BACKUP_PATH:-${DATA_PATH:-../data}/backups}:/arasul/backups
    devices:
      - /dev/bus/usb:/dev/bus/usb
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_BOOT
      - SYS_NICE
    # no-new-privileges intentionally omitted: sudo reboot requires setuid
    depends_on:
      postgres-db:
        condition: service_healthy
      metrics-collector:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python3', '/app/heartbeat.py', '--test']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${RAM_LIMIT_SELF_HEALING:-512M}
          pids: 100

  # 3. Backup Service (always-on for 5-year autonomous operation)
  backup-service:
    build:
      context: ../services/backup-service
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-}backup-service
    hostname: backup-service
    restart: always
    networks:
      - arasul-backend
      - arasul-monitoring
      # Ohne dieses Netz hat der Dienst KEINEN Docker-Zugriff — und genau daran
      # ist der Restore-Drill (und frueher die MinIO-/Qdrant-Sicherung) still
      # gescheitert: `docker exec`/`docker cp`/`docker run` liefen ins Leere,
      # die Fallbacks im Skript packten ein leeres Verzeichnis ein, und die
      # Integritaetspruefung meldete das als "verified".
      - arasul-docker-proxy
    environment:
      # Zugriff ausschliesslich ueber den restriktiven Socket-Proxy, nie direkt
      # auf /var/run/docker.sock — gleiches Muster wie dashboard-backend.
      DOCKER_HOST: tcp://docker-proxy:2375
      POSTGRES_HOST: postgres-db
      POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD resolved via Docker secret (compose.secrets.yaml)
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_WEEKLY_RETENTION_WEEKS: ${BACKUP_WEEKLY_RETENTION_WEEKS:-12}
      TZ: ${TZ:-Europe/Berlin}
      BACKUP_REPORT_PATH: ${BACKUP_REPORT_PATH:-/backups/backup_report.json}
      # Das Ziel ausserhalb des Geraets (Phase C9): ein USB-Datentraeger oder
      # eine SMB-Freigabe im Kundennetz, eingehaengt vom Betriebssystem. KEIN
      # Cloud-Ziel. `auto` heisst: kopieren, wenn dort wirklich etwas
      # eingehaengt ist -- das Skript prueft die Geraetenummer des
      # Dateisystems, damit ein leerer Ordner nicht als "ausserhalb" zaehlt.
      BACKUP_EXTERN_AN: ${BACKUP_EXTERN_AN:-auto}
      BACKUP_EXTERN_ZIEL: /arasul/extern
    volumes:
      - ${BACKUP_PATH:-${DATA_PATH:-../data}/backups}:/backups
      - arasul-wal:/backups/wal
      # Apps und Flows SCHREIBBAR, und das ist eine bewusste Erweiterung
      # (Phase C9): der Weg zurueck (`wiederherstellen.sh`) legt die Pakete und
      # die Flow-Dateien wieder an ihren Platz, und er laeuft hier, weil hier
      # der Sicherungsschluessel liegt. Schreibrecht auf zwei Ordner ist der
      # kleinere Schritt neben dem, was dieser Dienst ohnehin darf: er haelt
      # das Datenbankpasswort und zieht jede Nacht die ganze Datenbank ab.
      - ${DATA_PATH:-../data}/apps:/arasul/apps
      - ${DATA_PATH:-../data}/flows:/arasul/flows
      # Die Konfiguration nur-lesend: `.env`, Zertifikate, Traefik, Geheimnisse.
      # Ohne sie faehrt auf einem leeren Geraet kein Container hoch. Der
      # Sicherungsschluessel selbst bleibt aus dem Archiv (siehe backup.sh).
      - ${ENV_DATEI:-../.env}:/arasul/konfiguration/.env:ro
      - ../config:/arasul/konfiguration/config:ro
      # Der Datentraeger ausserhalb. Haengt dort nichts, sieht der Container
      # einen leeren Ordner -- und meldet genau das, statt eine Kopie
      # ausserhalb zu behaupten.
      - ${BACKUP_EXTERN_PFAD:-/mnt/arasul-sicherung}:/arasul/extern
    depends_on:
      postgres-db:
        condition: service_healthy
    # Plan 023 S7. Vorher galt `partial_failure` hier als gesund und der
    # Wiederherstellungstest wurde gar nicht angesehen. Ergebnis: der Dienst
    # meldete sieben Tage durchgehend `healthy`, waehrend jede Nacht
    # `partial_failure` geschrieben wurde und der Test seit dem 16.08.2026
    # fehlschlug. Ein Healthcheck, der nur prueft ob crond laeuft, prueft nichts.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          pgrep crond > /dev/null || exit 1
          REPORT="${BACKUP_REPORT_PATH:-/backups/backup_report.json}"
          MARKE="/backups/.dienst_gestartet"
          if [ ! -f "$$REPORT" ]; then
            # Kein Bericht ist nur direkt nach dem Start in Ordnung.
            [ ! -f "$$MARKE" ] && exit 0
            [ $$(( $$(date +%s) - $$(stat -c %Y "$$MARKE") )) -lt 93600 ] || exit 1
            exit 0
          fi
          [ $$(( $$(date +%s) - $$(stat -c %Y "$$REPORT") )) -lt 93600 ] || exit 1
          grep -q '"status": *"completed"' "$$REPORT" || exit 1
          DRILL="/backups/restore_drill_report.json"
          if [ -f "$$DRILL" ]; then
            # Der Test laeuft woechentlich; 8 Tage Toleranz, dann muss er da sein.
            [ $$(( $$(date +%s) - $$(stat -c %Y "$$DRILL") )) -lt 691200 ] || exit 1
            grep -q '"status": *"ok"' "$$DRILL" || exit 1
          fi
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    <<: *default-security
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: ${RAM_LIMIT_BACKUP:-256M}
          pids: 100

networks:
  arasul-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETZ_BASIS:-172.30.0}.128/26

volumes:
  arasul-metrics:
