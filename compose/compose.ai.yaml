# Arasul Platform - AI Services
# LLM (Ollama), Embedding, Document Indexer (Text-Extraktion)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '10'

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # 1. LLM Service (Ollama)
  llm-service:
    build:
      context: ..
      dockerfile: services/llm-service/Dockerfile
    container_name: ${CONTAINER_PREFIX:-}llm-service
    hostname: llm-service
    restart: always
    networks:
      - arasul-backend
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:26b-q4}
      LLM_KEEP_ALIVE_SECONDS: ${LLM_KEEP_ALIVE_SECONDS:-3600}
      OLLAMA_STARTUP_TIMEOUT: ${OLLAMA_STARTUP_TIMEOUT:-120}
      OLLAMA_FLASH_ATTENTION: '1'
      # Kein Weg nach ollama.com. Am 24.08.2026 um 00:21 hat der
      # Ausgang-Lauscher eine Minute offene Verbindung zu 34.36.133.15
      # protokolliert, und `getent ahostsv4 ollama.com` liefert genau diese
      # Adresse. Derselbe Befund schon am 23.08. um 17:01. Gate G4 sagt
      # "Daten bleiben auf dem Geraet"; eine Verbindung, die niemand
      # angefordert hat, steht dem entgegen.
      #
      # Das Geraet braucht keine Cloud-Funktion von Ollama; im Repo kommt
      # `web_search` nicht vor.
      #
      # Modelle ueber `hf.co/` bleiben moeglich. Nachgemessen am 24.08.2026 mit
      # zwei Wegwerf-Containern, einmal mit und einmal ohne den Schalter,
      # gleicher Pull-Versuch:
      #
      #   Error: pull model manifest: realm host "huggingface.co" does not
      #          match original host "hf.co"
      #
      # Beide Male dieselbe Meldung, beide Male wurde huggingface.co erreicht.
      # Der Schalter zieht diesen Weg also nicht zu.
      #
      # Ob er die ollama.com-Verbindung wirklich verhindert, sagt erst der
      # Lauscher: `scripts/test/ausgang-lauscher.sh stand llm-service`.
      OLLAMA_NO_CLOUD: '${OLLAMA_NO_CLOUD:-1}'
      # q8_0 statt q4_0 (Harness v2, 2026-07-30): halbiert den KV-Speicher
      # gegenüber f16 bei praktisch verlustfreier Qualität; q4_0 sparte mehr,
      # kostete aber messbar Antwortqualität — auf einem 64-GB-Orin ist der
      # Speicher nicht der Engpass. Auf knappen 32-GB-Geräten via .env zurück.
      OLLAMA_KV_CACHE_TYPE: '${OLLAMA_KV_CACHE_TYPE:-q8_0}'
      # Default-Kontextfenster für alle geladenen Modelle. Die Werkzeugschleife
      # der Flows braucht ≥32k — Ollamas Default (4k) schneidet Tool-Definitionen
      # + Verlauf sonst STILL ab und das Modell "vergisst" seine Werkzeuge.
      # KV-Cache-Kosten sind durch q8_0 + Flash Attention gedämpft; auf knappen
      # 32-GB-Orins via .env absenkbar.
      OLLAMA_CONTEXT_LENGTH: '${OLLAMA_CONTEXT_LENGTH:-32768}'
      # NUM_PARALLEL=2 lets two chat requests stream concurrently (Balanced
      # latency target: 2 users OK, 3+ queue). Lower to 1 on tight 32 GB Orin
      # by exporting OLLAMA_NUM_PARALLEL=1 in .env.
      OLLAMA_NUM_PARALLEL: '${OLLAMA_NUM_PARALLEL:-2}'
      OLLAMA_MAX_LOADED_MODELS: '${OLLAMA_MAX_LOADED_MODELS:-3}'
      OLLAMA_NUM_GPU: '99'
      # CUDA/Tegra library paths for JetPack 6 GPU acceleration
      LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu:/usr/lib/ollama/cuda_jetpack6
    volumes:
      - arasul-llm-models:/home/ollama/.ollama
      - ../services/llm-service/healthcheck.sh:/healthcheck.sh:ro
      - ${DATA_PATH:-../data}/models:/host-models:ro
      # Mount host CUDA toolkit (cuBLAS, cuDNN, cuDart) for GPU inference
      - /usr/local/cuda/lib64:/usr/local/cuda/lib64:ro
    ports:
      # Bind to localhost only — never expose the unauthenticated Ollama API to the
      # LAN. Internal containers reach it via the network name (llm-service:11434);
      # host-local clients via 127.0.0.1. Remote/Tailscale access, if needed, must go
      # through an authenticated proxy (e.g. `tailscale serve tcp 11434`), not here.
      - '127.0.0.1:${LLM_API_PORT:-11434}:11434' # Ollama API (host-local only)
    runtime: nvidia
    tmpfs:
      - /tmp:noexec,nosuid,size=256M
    <<: *default-security
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LLM:-8}'
          memory: ${RAM_LIMIT_LLM:-32G}
          pids: 512
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres-db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', '/bin/bash', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging: *default-logging

  # 2. Embedding Service
  embedding-service:
    # Kein Profil: der Dienst wird gebraucht. Er stand bis zum 24.08.2026 in
    # 'classic-rag', obwohl sieben Stellen ausserhalb des klassischen RAG ihn
    # rufen — darunter die OpenAI-kompatible Schnittstelle /v1/embeddings und
    # das Wissensraum-Routing. Auf dem Geraet lief er deshalb ohnehin, nur
    # sagte die Datei etwas anderes.
    build:
      context: ..
      dockerfile: services/embedding-service/Dockerfile
      args:
        L4T_PYTORCH_TAG: ${L4T_PYTORCH_TAG:-r36.4.0}
        CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-8.7}
    container_name: ${CONTAINER_PREFIX:-}embedding-service
    hostname: embedding-service
    restart: always
    networks:
      - arasul-backend
    environment:
      MODEL_NAME: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      SERVICE_PORT: ${EMBEDDING_SERVICE_PORT:-11435}
      SERVICE_URL: http://localhost:${EMBEDDING_SERVICE_PORT:-11435}
      VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-1024}
      MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-8192}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-1024}
      EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-8192}
      SENTENCE_TRANSFORMERS_HOME: /models
      ENABLE_RERANKING: 'true'
      FLASHRANK_MODEL: ms-marco-MiniLM-L-12-v2
      BGE_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      EMBEDDING_USE_FP16: 'true'
      STAGE2_VRAM_FLOOR_MB: '${STAGE2_VRAM_FLOOR_MB:-4096}'
      CUDA_VISIBLE_DEVICES: 0
      TORCH_CUDA_ARCH_LIST: '${TORCH_CUDA_ARCH_LIST:-8.7}'
    volumes:
      - arasul-embeddings-models:/models
    runtime: nvidia
    tmpfs:
      - /tmp:noexec,nosuid,size=256M
    <<: *default-security
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_EMBEDDING:-4}'
          memory: ${RAM_LIMIT_EMBEDDING:-12G}
          pids: 512
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres-db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:11435/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    logging: *default-logging

  # 4. Document Indexer - Text-Extraktion fuer die externe API
  #
  # Seit dem 26.08.2026 (Phase B4 des Rueckbaus) ist das kein Indexer mehr,
  # nur der Name ist geblieben: der Dienst nimmt eine Datei per multipart auf
  # /extract-text entgegen und gibt den Text zurueck. Kein MinIO, kein
  # Postgres, keine Embeddings, kein Zyklus. Wer hier POSTGRES_* oder
  # EMBEDDING_* sucht, sucht einen Stand vor B4.
  document-indexer:
    build:
      context: ..
      dockerfile: services/document-indexer/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11.12}
    container_name: ${CONTAINER_PREFIX:-}document-indexer
    hostname: document-indexer
    restart: always
    networks:
      - arasul-backend
    environment:
      DOCUMENT_INDEXER_API_PORT: ${DOCUMENT_INDEXER_API_PORT:-9102}
      DOCUMENT_MAX_SIZE_MB: ${DOCUMENT_MAX_SIZE_MB:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9102/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    <<: *default-security
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${RAM_LIMIT_DOCUMENT_INDEXER:-2G}
          pids: 128

volumes:
  arasul-llm-models:
  arasul-embeddings-models:
