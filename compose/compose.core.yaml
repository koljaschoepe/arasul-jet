# Arasul Platform - Core Infrastructure
# PostgreSQL, Docker-Proxy, Traefik Reverse Proxy
#
# MinIO ist am 26.08.2026 (Phase B4 des Rueckbaus) entfallen: die
# Text-Extraktion reicht Dateien per multipart direkt an den Indexer, kein
# Dienst liest mehr aus dem Objektspeicher.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '10'

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # 1. PostgreSQL - Telemetry and Audit Database
  postgres-db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-}postgres-db
    hostname: postgres-db
    restart: always
    stop_grace_period: 30s
    networks:
      - arasul-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
    # Plan 023 S5: setzt den Besitzer des WAL-Archivziels, bevor der offizielle
    # Einstieg uebernimmt. Ohne das scheitert archive_command dauerhaft und
    # pg_wal laeuft die Platte voll.
    entrypoint: ['/usr/local/bin/entrypoint-wal.sh']
    command:
      - 'postgres'
      - '-c'
      - 'config_file=/etc/postgresql/postgresql.conf'
    volumes:
      - arasul-postgres:/var/lib/postgresql/data
      - ../services/postgres/init:/docker-entrypoint-initdb.d
      - ../config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../services/postgres/entrypoint-wal.sh:/usr/local/bin/entrypoint-wal.sh:ro
      - arasul-wal:/backups/wal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 60s
    <<: *default-security
    deploy:
      resources:
        limits:
          memory: ${RAM_LIMIT_POSTGRES:-4G}
          cpus: '4.0'
          pids: 200
    logging: *default-logging

  # 2. Docker Socket Proxy - Restricts Docker API access for backend services
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ${CONTAINER_PREFIX:-}docker-proxy
    hostname: docker-proxy
    restart: always
    networks:
      - arasul-docker-proxy
    environment:
      # Granted API sections
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      SYSTEM: 1
      BUILD: 1
      COMMIT: 1
      POST: 1
      # Fine-grained container controls
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      # Explicitly denied (defaults)
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run:size=8M
      - /tmp:noexec,nosuid,size=8M
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:2375/_ping || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    <<: *default-security
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: ${RAM_LIMIT_DOCKER_PROXY:-128M}
          pids: 50
    logging: *default-logging

  # 3. Reverse Proxy (Traefik)
  reverse-proxy:
    image: traefik:v2.11
    container_name: ${CONTAINER_PREFIX:-}reverse-proxy
    hostname: reverse-proxy
    restart: always
    networks:
      - arasul-frontend
      - arasul-backend
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../config/traefik:/etc/traefik:ro
      - ${LOGS_PATH:-../logs}:/arasul/logs
    depends_on:
      postgres-db:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    <<: *default-security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH # Read TLS key files owned by host user
    deploy:
      resources:
        limits:
          memory: ${RAM_LIMIT_REVERSE_PROXY:-512M}
          cpus: '2.0'
          pids: 100

networks:
  arasul-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETZ_BASIS:-172.30.0}.0/26
  arasul-backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETZ_BASIS:-172.30.0}.64/26
  # Dedicated network for the Docker Socket Proxy. Only dashboard-backend,
  # self-healing-agent and backup-service join it — no other service (n8n,
  # document-indexer, …) has a network path to docker-proxy:2375, so a
  # compromised workload container cannot reach the privileged Docker API.
  #
  # Am 23.08.2026 auf dem Orin nachgezaehlt statt geglaubt:
  #   docker network inspect arasul-platform_arasul-docker-proxy
  #   -> docker-proxy self-healing-agent dashboard-backend backup-service
  # Der Kommentar nannte drei Namen und meinte vier. Wer diese Liste aendert,
  # zaehlt sie dort nach.
  arasul-docker-proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETZ_BASIS:-172.30.0}.192/26

volumes:
  arasul-postgres:
  arasul-wal:
