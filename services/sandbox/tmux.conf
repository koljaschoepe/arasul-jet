# Arasul Sandbox — tmux config for web terminal (xterm.js)
# Optimized for persistent sessions accessed via browser

# Large scrollback buffer (50K lines vs 10K in xterm.js)
set -g history-limit 50000

# Enable mouse support (scroll, click, resize panes)
set -g mouse on

# 256 color + true color support.
# default-terminal "tmux-256color": das von tmux empfohlene innere TERM (das
# Terminfo ist im Sandbox-Image vorhanden) — modelliert Alternate-Screen,
# Kursiv & Co. korrekt für Fullscreen-TUIs (claude/codex/htop/vim).
set -g default-terminal "tmux-256color"
# 24-bit-Farbe an das äußere xterm.js durchreichen — modernes terminal-features
# (tmux >= 3.2) plus der ältere Tc-Override als Rückfall.
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
# COLORTERM in jede Pane vererben, damit TUIs 24-bit ausgeben.
set-environment -g COLORTERM truecolor

# Reduce escape time for faster key response. 10ms ist schnell genug für TUIs,
# behält aber Toleranz für über die Netzverbindung gesplittete Alt/Meta-/
# Funktionstasten-Sequenzen (0 würde diese Toleranz komplett entfernen).
set -g escape-time 10

# Fokus-Events an die TUI weiterreichen (Repaint/Cursor bei Fokuswechsel) und
# Größe aggressiv an den aktiven Client anpassen — verhindert Versatz beim
# Reconnect/Resize eines Fullscreen-Programms.
set -g focus-events on
setw -g aggressive-resize on

# Disable status bar — web UI already shows connection info
set -g status off

# Window/pane numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on
