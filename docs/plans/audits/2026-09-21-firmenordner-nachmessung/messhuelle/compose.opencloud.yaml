# Nachmessung J33, Kandidat OpenCloud mit dem Ablagetreiber `posix`: echte Dateien
# unter einem lesbaren Pfad am Geraet (Bind-Mount unter ~/j33nach/opencloud/).
# CPU-Grenze `cpus: 2` und RAM-Grenze 2 GB; Port nur auf 127.0.0.1.
name: j33nach-opencloud
services:
  server:
    image: opencloudeu/opencloud-rolling:latest
    container_name: j33nach-opencloud-server
    mem_limit: 2g
    cpus: 2
    restart: 'no'
    entrypoint: ['/bin/sh', '-c', 'opencloud init || true; exec opencloud server']
    ports: ['127.0.0.1:18082:9200']
    environment:
      OC_URL: https://localhost:18082
      OC_INSECURE: 'true'
      PROXY_ENABLE_BASIC_AUTH: 'true'
      IDM_ADMIN_PASSWORD: j33nach-Admin-2026
      IDM_CREATE_DEMO_USERS: 'false'
      OC_LOG_LEVEL: warn
      STORAGE_USERS_DRIVER: posix
      STORAGE_USERS_POSIX_ROOT: /var/lib/opencloud/posix
      STORAGE_USERS_POSIX_WATCH_FS: 'true'
      STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
      STORAGE_USERS_POSIX_PERSONAL_SPACE_PATH_TEMPLATE: 'users/{{.User.Username}}'
      STORAGE_USERS_POSIX_GENERAL_SPACE_PATH_TEMPLATE: 'projects/{{.SpaceName}}'
    volumes:
      - /home/arasul/j33nach/opencloud/config:/etc/opencloud
      - /home/arasul/j33nach/opencloud/daten:/var/lib/opencloud
