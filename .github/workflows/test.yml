name: CI

# Reine Dokumentation loest keinen Lauf aus. Die Sperre sitzt bewusst hier am
# AUSLOESER und nicht als `if:` an den einzelnen Jobs: GitHub laesst einen
# Pflicht-Check, dessen ganzer Workflow durch `paths-ignore` uebersprungen
# wurde, automatisch als erfuellt durchgehen. Ein uebersprungener EINZELJOB
# bekommt diese Behandlung NICHT und wuerde einen reinen Doku-PR fuer immer
# blockieren.
#
# WER BRANCH-SCHUTZ EINSCHALTET, muss das vorher einmal echt ausprobieren:
# einen PR aufmachen, der nur eine .md-Datei aendert, und nachsehen, ob der
# Merge-Knopf freigegeben wird. Ein falscher Griff faellt hier nicht auf, er
# blockiert lautlos. Stand 21.08.2026 hat dieses Repo weder Branch-Schutz noch
# Rulesets, nachgemessen ueber die API. P9-3 im Master-Plan verlangt aber, "CI
# Summary" zum Pflicht-Check zu machen, also wird der Fall kommen.
on:
  push:
    branches: [main]
    paths-ignore: &nur_doku
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *nur_doku

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Welche Pfade sind betroffen. Grund: am 21.08.2026 gemessen, dass 26 von 135
  # Commits reine Dokumentation waren und trotzdem alle dreizehn Jobs samt
  # fuenf Docker-Bauten ausgeloest haben. Die grobe Sperre dafuer ist
  # `paths-ignore` oben; dieser Job entscheidet zusaetzlich, ob die Bauten
  # ueberhaupt noetig sind.
  #
  # `packages/` und `libs/` stehen mit im Filter, weil die Dockerfiles
  # `packages/shared-schemas` und `libs/shared-python/structured_logging.py` in
  # die Images kopieren. Beim ersten Entwurf fehlten sie, und eine Aenderung nur
  # dort haette den Bau stillschweigend uebersprungen.
  #
  # IM ZWEIFEL WIRD GEBAUT. Ein Filter, der faelschlich ueberspringt, ist genau
  # das stille Loch, das dieser Datei schon zweimal passiert ist. Ein Filter,
  # der zu oft baut, kostet nur Zeit.
  # ----------------------------------------------------------------------------
  changes:
    name: Betroffene Pfade
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.pruefen.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pruefen
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SPITZE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          bauen() { echo "docker=true" >> "$GITHUB_OUTPUT"; echo "Ergebnis: bauen"; exit 0; }
          if [ -z "${BASIS}" ] || [ "${BASIS}" = "0000000000000000000000000000000000000000" ]; then
            echo "Keine belastbare Vergleichsbasis."; bauen
          fi
          if ! git cat-file -e "${BASIS}^{commit}" 2>/dev/null; then
            echo "Basis ${BASIS} liegt nicht im Klon."; bauen
          fi
          geaendert=$(git diff --name-only "${BASIS}" "${SPITZE}") || bauen
          echo "Geaenderte Dateien:"; echo "${geaendert}" | sed 's/^/  /'
          if printf '%s\n' "${geaendert}" | grep -qE '^(apps/|services/|packages/|libs/|\.github/workflows/)|(^|/)Dockerfile|(^|/)\.dockerignore$|^package(-lock)?\.json$'; then
            echo "Docker-relevante Pfade betroffen."; bauen
          fi
          echo "docker=false" >> "$GITHUB_OUTPUT"
          echo "Ergebnis: ueberspringen"

  # ----------------------------------------------------------------------------
  # Backend: lint + full Jest suite (coverage thresholds enforced via
  # package.json). Runs from the monorepo root so `file:` workspace deps to
  # @arasul/shared-schemas resolve correctly.
  # ----------------------------------------------------------------------------
  backend:
    name: Backend (lint + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint (backend)
        run: npm run lint:backend

      - name: Jest (with coverage)
        working-directory: apps/dashboard-backend
        run: npx jest --coverage --maxWorkers=2

      # Advisory: reports high/critical vulnerabilities so they show up in the
      # Actions summary without blocking the pipeline. Run from workspace root
      # so the single root lockfile is audited once per CI run.
      - name: npm audit (advisory)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/dashboard-backend/coverage/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Frontend: lint + vitest. Same workspace-root install strategy as backend.
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Diese drei Schritte liefen bis zum 20.08.2026 mit `continue-on-error`,
      # weil ein Altbestand von rund 1500 Lint-Meldungen, 580 Typfehlern und 90
      # roten Komponententests abgearbeitet werden sollte. Der Altbestand ist
      # weg. Am 20.08.2026 auf `main` gemessen: tsc 0 Fehler, ESLint 0 Fehler,
      # Vitest 915 von 915 gruen.
      #
      # Solange der Schalter stand, war das gruene Haekchen an diesem Job eine
      # Aussage ueber gar nichts: er meldete auch dann Erfolg, wenn jeder Test
      # rot war. Wer ihn wieder auf `true` setzt, macht die Pipeline erneut
      # stumm und muss dazuschreiben, welche Zahl er gemessen hat.
      - name: Typecheck (frontend, tsc)
        working-directory: apps/dashboard-frontend
        run: npx tsc --noEmit

      - name: Lint (frontend)
        run: npm run lint:frontend

      - name: Vitest (with coverage)
        working-directory: apps/dashboard-frontend
        run: npx vitest run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/dashboard-frontend/coverage/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Docker build smoke — each image must at least build. No full-stack run.
  # Backend uses the multi-stage 'test' target so test deps + tests are
  # exercised by the build itself.
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker build · ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: dashboard-backend
            dockerfile: apps/dashboard-backend/Dockerfile
            context: .
            target: runtime
          - name: dashboard-backend-test
            dockerfile: apps/dashboard-backend/Dockerfile
            context: .
            target: test
          - name: dashboard-frontend
            dockerfile: apps/dashboard-frontend/Dockerfile
            context: .
          - name: metrics-collector
            dockerfile: services/metrics-collector/Dockerfile
            context: .
          - name: self-healing-agent
            dockerfile: services/self-healing-agent/Dockerfile
            context: .
          # Der Indexer stand hier bis zum 24.08.2026 nicht drin, und seine
          # Requirements werden im pytest-Job bewusst nicht installiert (siehe
          # dort). Damit war er der einzige Dienst, dessen Abhaengigkeiten in
          # keinem einzigen CI-Job je echt aufgeloest wurden. #671 hob
          # qdrant-client auf >=1.19 an, wo `NamedVector` nicht mehr existiert,
          # die CI blieb gruen, und der Fehler schlug erst Tage spaeter beim
          # ersten Neubau auf dem Geraet zu — als zwei gescheiterte Deploys.
          - name: document-indexer
            dockerfile: services/document-indexer/Dockerfile
            context: .
            # Bauen allein haette #685 NICHT gefunden: das Image baut sauber,
            # der ImportError kommt erst, wenn der Prozess startet.
            smoke: import api_server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: false
          platforms: linux/amd64
          # Nur wo eine Startprobe folgt, muss das Image auch im lokalen Daemon
          # landen. `load` kostet Zeit, deshalb nicht fuer alle.
          load: ${{ matrix.image.smoke != '' }}
          tags: ${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Startprobe
        if: matrix.image.smoke != ''
        env:
          BILD: ${{ matrix.image.name }}:ci
          SMOKE: ${{ matrix.image.smoke }}
        # Ohne Netz und ohne Secrets: geprueft wird ausschliesslich, ob der
        # Prozess seine Importe aufloest. Alles, was danach kommt (Datenbank,
        # Modelldienst), gehoert nicht hierher und wuerde nur falsche Alarme erzeugen.
        run: docker run --rm --network none "$BILD" python3 -c "$SMOKE"

  # ----------------------------------------------------------------------------
  # Lockfile drift guard (Master-Plan P9-4 / AC2): the repo keeps a single
  # ROOT package-lock.json. `npm ci` from root must install every workspace
  # cleanly — it errors if a package.json bump landed without updating the root
  # lock, the exact drift that broke main on 2026-05-05. This directly tests the
  # failure mode (and is robust to npm-version canonical-form differences that a
  # byte-exact `--package-lock-only` diff would false-positive on).
  # ----------------------------------------------------------------------------
  lockfile-guard:
    name: Lockfile drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Root lock must install cleanly (npm ci)
        run: npm ci --ignore-scripts

  # ----------------------------------------------------------------------------
  # Die Migrationskette gegen eine leere Datenbank (Entscheidung 27.08.2026).
  #
  # Migration 169 ist am 27.08.2026 am Orin gescheitert, und die CI war dabei
  # gruen: sie hat die Migrationen nie ausgefuehrt, nur die Dateien
  # danebenliegen sehen. Der Fehler kam beim Deploy heraus. Auf einem FRISCHEN
  # Geraet waere er schlimmer gewesen — der Postgres-Einstiegspunkt faehrt mit
  # ON_ERROR_STOP=1, der Container waere gar nicht erst hochgekommen.
  #
  # `npm ci` steht hier, weil das Skript in seinem zweiten Teil den echten
  # `migrationRunner.js` des Backends gegen dieselbe frisch initialisierte
  # Datenbank faehrt. Ohne die Abhaengigkeiten bricht es ab statt zu schweigen.
  # ----------------------------------------------------------------------------
  migrationen:
    name: Migrationskette (leere Datenbank)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: 000 bis heute gegen eine leere Datenbank
        run: bash scripts/test/migrationskette.sh

  # ----------------------------------------------------------------------------
  # Python services: non-blocking pytest. Some services have no tests yet.
  # ----------------------------------------------------------------------------
  python-services:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [metrics-collector, self-healing-agent, document-indexer]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          # document-indexer: seine Tests stubben die schweren Abhaengigkeiten
          # (PyMuPDF, spacy, qdrant-client, psycopg2, …) selbst und laufen
          # bewusst in einer nackten Umgebung. Sie zu installieren waere nur
          # ein paar Minuten CI-Zeit fuer nichts.
          #
          # Der Satz stimmt fuer die Tests, aber er hat ein Loch hinterlassen:
          # bis zum 24.08.2026 war das der EINZIGE Ort, an dem die Requirements
          # des Indexers haetten aufgeloest werden koennen — und weil es hier
          # nicht passiert, wurde eine kaputte Versionsanhebung (#671) gruen
          # durchgewunken. Geschlossen wird das jetzt nicht hier, sondern in
          # der Startprobe des docker-build-Jobs, wo es hingehoert: dort laeuft
          # das echte Image mit den echten Paketen.
          if [ "${{ matrix.service }}" != "document-indexer" ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov pytest-mock || true
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run pytest (green if a service has no tests yet)
        working-directory: services/${{ matrix.service }}
        env:
          # `libs/shared-python` (structured_logging & Co.) kopieren die
          # Dockerfiles ins Image. Im CI-Checkout liegt es daneben statt darin,
          # deshalb hier auf den Pfad — sonst scheitert der Import und der
          # Testlauf bricht schon beim Einsammeln ab.
          PYTHONPATH: ${{ github.workspace }}/libs/shared-python
        run: |
          # Frueher: `pytest … || echo "…"`. Das schluckte AUCH echte
          # Fehlschlaege — der Job blieb gruen, egal was passierte. So fiel
          # monatelang nicht auf, dass die document-indexer-Tests sich nicht
          # einmal mehr einsammeln liessen. Jetzt wird nur der Fall
          # „keine Tests gefunden" (pytest-Exitcode 5) durchgewunken.
          set +e
          pytest --cov=. --cov-report=xml
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "Keine Tests in diesem Service — ok."
            exit 0
          fi
          exit "$code"

  # ----------------------------------------------------------------------------
  # Summary: aggregate pass/fail so branch protection can require a single
  # check instead of listing every matrix cell.
  # ----------------------------------------------------------------------------
  # Waechter: die vier Pruefungen, die bis zum 20.08.2026 NUR in
  # scripts/test/run-tests.sh liefen, also nur dann, wenn jemand sie von Hand
  # aufrief. Genau das ist der Weg, auf dem technische Schuld zurueckkommt:
  # ein Zug, der die Hooks umgeht (Weboberflaeche, --no-verify, ein Workflow,
  # der selbst committet), hat sie nie gesehen. Alle vier laufen in Sekunden,
  # nur der Tote-Code-Lauf braucht knapp eine Minute.
  # ----------------------------------------------------------------------------
  guards:
    name: Guards (Design, toter Code, Bausteine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Baustein-Set (Plan 023 C1, C2)
        run: python3 scripts/test/bausteine.py --pfad .

      - name: Namensregister (Plan 023 D1)
        run: python3 scripts/test/modellnamen.py --pfad .

      # Das Designsystem hat zwei Ausgaenge und eine Quelle (Phase D7): die
      # Shell uebersetzt `packages/marken/src/` selbst, eine App laedt das
      # eingecheckte Buendel. Eine Kopie veraltet lautlos, und nichts an der
      # Oberflaeche wuerde davon rot.
      - name: Marken (Designsystem, Phase D7)
        run: python3 scripts/test/marken.py --wurzel .

      # Die vier Modelle stehen einmal in config/modelle/kurzliste.json und
      # muessen an fuenf weiteren Stellen dasselbe sagen (Phase C8). Hier und
      # nicht nur in `run-tests.sh`: ein Zug ueber die Weboberflaeche oder mit
      # `--no-verify` saehe den Waechter sonst nie, und genau so sind die
      # Modell-Listen vorher auseinandergelaufen.
      - name: Kurzliste (Phase C8)
        run: python3 scripts/test/kurzliste.py --wurzel .

      - name: Einheiten (Plan 023 D4)
        run: python3 scripts/test/einheiten.py --pfad .

      - name: Gedankenstriche als Trenner
        run: python3 scripts/test/gedankenstriche.py --pfad .

      - name: Design-System (Farben, Variablen)
        run: node scripts/test/check-design-system.js

      - name: Code-Qualitaet (hartkodierte URLs)
        run: node scripts/test/check-code-quality.js

      - name: Der Faden (hoechstens ein Plan in docs/plans/active)
        run: python3 scripts/test/plan-faden.py --pfad .

      - name: Pfadfilter deckt die Kopierquellen ab (aus der Review von #454)
        run: python3 scripts/test/pfadfilter.py --pfad .

      - name: Durchreichung der Stellschrauben (Plan 023 E1)
        run: python3 scripts/test/durchreichung.py --wurzel .

      - name: Datenordner werden vorher angelegt (Plan 023 H1)
        run: python3 scripts/test/datenordner.py --wurzel .

      - name: Jede Tabelle ist im Werksreset eingeordnet (Plan 023 B5)
        run: python3 scripts/test/werksreset-tabellen.py --wurzel .

      # Was der Werksreset als Zustand des Geraets loescht, muss die Uebernahme
      # beim Update mittragen. Faellt ein Pfad aus der einen Liste, laesst ein
      # Update ihn im alten Verzeichnis liegen -- waehrend die Datenbank ueber
      # den festen Projektnamen mitkommt. Genau das war die halbe Migration vom
      # 28.08.2026.
      - name: 'Zustand: was der Reset loescht, traegt die Uebernahme mit'
        run: python3 scripts/test/zustand.py --wurzel .

      # Diese drei liefen bisher nur in `run-tests.sh`, also nur lokal. Ein Zug
      # ueber die Weboberflaeche, mit `--no-verify` oder aus einem Workflow
      # heraus hat sie nie gesehen — und genau das ist der Weg, auf dem die
      # Schuldenliste der undokumentierten Endpunkte still wieder wachsen
      # koennte. Sie steht seit dem 23.08.2026 bei null (Plan 023 K1) und soll
      # dort bleiben.
      - name: Jeder Endpunkt hat eine Beschreibung (Plan 023 K1)
        run: python3 scripts/test/endpunkte.py --wurzel .

      - name: Anleitungen zeigen nichts, was es nicht gibt (Plan 023 K3)
        run: python3 scripts/test/anleitungen.py

      - name: Stiller Tod (Zuweisungen, die ein Skript wortlos beenden)
        run: python3 scripts/test/stiller-tod.py --wurzel .

      # 28.08.2026, Phase G1: `backup-service` war definiert, gebaut -- und nie
      # gestartet. Ein frisch installiertes Geraet kam ohne Sicherung hoch, und
      # gemerkt hat es erst Abnahme A6, die keinen Gegenstand hatte. Vier
      # Listen nennen die Dienste, drei waren richtig; die falsche war die,
      # die den Bootstrap steuert.
      - name: Dienste (jeder Dienst des Compose faehrt beim Bootstrap hoch)
        run: python3 scripts/test/dienste.py --wurzel .

      # 28.08.2026: die drei Drosseln des Geraets stehen im Backend und zweimal
      # in den Abnahmen (Browser und curl), weil ein Shell-Skript kein
      # Node-Modul laden kann. Aendert das Backend eine Zahl, faellt es hier
      # und nicht erst als 429 mitten in einer Abnahme am Geraet.
      - name: Drosselzahlen (Backend und Abnahmen nennen dieselben Drosseln)
        run: python3 scripts/test/drosselzahlen.py --wurzel .

      # Und die Logik dahinter, mit gefaelschten Kopfzeilen statt einer vollen
      # Drossel am Geraet: Browser-Seite und curl-Seite je einmal.
      - name: Drossel-Selbsttest (drossel.mjs)
        run: node scripts/test/drossel-selbsttest.mjs
      - name: Anmeldung-Selbsttest (anmeldung.sh, pruefbenutzer.sh)
        run: bash scripts/test/anmeldung-selbsttest.sh

      # Die vierte aus derselben Familie, 28.08.2026: nicht der Rueckgabewert,
      # sondern der Pfad. Ein Skript in `scripts/validate/` ging nur EINE Ebene
      # hoch, sein `PROJECT_ROOT` zeigte damit auf `scripts/`, und der Bootstrap
      # suchte `scripts/docker-compose.yml`. Auf einem Arbeitsgeraet faellt das
      # nie auf, auf jedem frischen sofort.
      - name: Wurzelpfad (Skripte, die ihr Wurzelverzeichnis falsch ausrechnen)
        run: python3 scripts/test/wurzelpfad.py --wurzel .

      # Der Schwesterfall, 27.08.2026: `docker logs … | grep -q …` unter
      # `pipefail`. grep steigt beim ersten Treffer aus, docker logs schreibt
      # in ein geschlossenes Rohr und endet mit 141, und die Bedingung wird
      # falsch — gerade WEIL der gesuchte Text da ist. Der Job
      # "Migrationskette" hat daran drei Minuten gewartet und "nein" gemeldet.
      - name: Rohrbruch (Pipes, die beim ersten Treffer zerreissen)
        run: python3 scripts/test/rohrbruch.py --wurzel .

      # Die dritte aus derselben Familie, 27.08.2026: nicht der Wert einer
      # Pipe, sondern die Reihenfolge der Ersetzung. `local a="$1" b="$a"`
      # loest `$a` auf, bevor `local` laeuft -- unter `set -u` das Ende des
      # Skripts. Die Abnahme des Deploy-Endpunkts kam am Orin daran nicht
      # ueber ihren ersten Schritt hinaus.
      - name: Eigenbezug (local-Zeilen, die sich auf sich selbst beziehen)
        run: python3 scripts/test/eigenbezug.py --wurzel .

      - name: Routenregeln (asyncHandler, keine nackten Fehler)
        run: python3 scripts/test/routenregeln.py --wurzel .

      - name: Rollenregeln (jede Route prueft admin oder mitarbeiter, Phase C1)
        run: python3 scripts/test/rollenregeln.py --wurzel .

      - name: Der Deploy-Rollback sagt die Wahrheit ueber sich
        run: bash scripts/test/rollback-meldung.sh

      - name: Selbsttest der Waechter
        run: bash scripts/test/waechter-selbsttest.sh

      # Die Sperre aus release.yml laeuft im Ernstfall einmal je Release, und
      # wenn sie dann durchwinkt, steht der Fehler fuer immer im Netz. Der
      # Selbsttest hat schon beim Anlegen einen gefunden: bei genau einem Tag
      # im Repo brach das Skript unter `pipefail` ab -- mit Rueckgabe 0.
      - name: Selbsttest der Tag-Sperre (release.yml)
        run: bash scripts/test/tag-pruefen-selbsttest.sh

      - name: Toter Code (Plan 023 B3)
        run: bash scripts/test/toter-code.sh

  # ----------------------------------------------------------------------------
  # Installation aus dem Artefakt auf einem leeren Rechner (Phase C10,
  # 28.08.2026).
  #
  # WARUM ES DIESEN JOB GIBT. Am 27.08.2026 galt die Auslieferung als fertig:
  # die CI baute ein Artefakt, das Release hing am Repo, `install.sh` lag im
  # Wurzelverzeichnis, und die Pruefung im Release-Workflow sah nach, ob die
  # Dateien DRIN sind. Sie hat das Artefakt nie AUSGEFUEHRT. Beim ersten echten
  # Werksreset am Orin lief die Installation dann nicht ohne Hand durch, und
  # von den fuenf Funden waeren vier hier aufgefallen -- vier Wegewechsel und
  # eine Zuweisung, allesamt ohne Jetson-Hardware messbar.
  #
  # Gemessen wird deshalb an dem, was der Kunde bekommt: das Artefakt wird
  # gebaut, ausgepackt und `install.sh --nur-vorbereiten` darin gestartet.
  # Weiter geht es nicht, denn `./arasul bootstrap` baut zwoelf Images fuer
  # ARM64. Alles davor -- Fassung, Voraussetzungen, `.env`, die Validatoren,
  # wie docker compose die `.env` liest -- laeuft hier vollstaendig.
  # ----------------------------------------------------------------------------
  installation:
    name: Installation (install.sh aus dem Artefakt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `fassung_aus_bau` fragt `git describe --tags`; ohne Historie
          # bekaeme das Artefakt keine Fassung und `install.sh` bricht ab --
          # was hier richtig waere, aber aus dem falschen Grund.
          fetch-depth: 0

      - name: Artefakt bauen
        run: bash scripts/deploy/artefakt-bauen.sh --ausgabe /tmp/dist

      - name: Auspacken, wie es ein Kunde tut
        id: auspacken
        run: |
          set -eu
          mkdir -p /tmp/geraet
          tar xzf /tmp/dist/arasul-*.tar.gz -C /tmp/geraet
          wurzel=$(find /tmp/geraet -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "wurzel=$wurzel" >> "$GITHUB_OUTPUT"
          echo "Ausgepackt nach: $wurzel"

      # Der Lauf selbst. Das Passwort ist fest und offen: es lebt in einem
      # Wegwerf-Runner und wird von keinem Dienst angenommen.
      - name: install.sh --nur-vorbereiten
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: ./install.sh --nur-vorbereiten --passwort 'AbnahmeCi2026x'

      - name: Was dabei herausgekommen ist
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: |
          set -eu
          [ -f .env ] || { echo "Keine .env geschrieben." >&2; exit 1; }
          fassung=$(grep '^SYSTEM_VERSION=' .env | tail -1 | cut -d= -f2-)
          case "$fassung" in
            ''|Vorserie|0.0.0)
              echo "SYSTEM_VERSION ist \"$fassung\" -- keine Fassung aus dem Bau." >&2
              exit 1 ;;
          esac
          echo "SYSTEM_VERSION=$fassung"
          # Die Rechte der Datei: sie traegt das Startpasswort im Klartext, bis
          # der Bootstrap es entwertet.
          rechte=$(stat -c '%a' .env)
          [ "$rechte" = "600" ] || { echo ".env hat Rechte $rechte statt 600." >&2; exit 1; }

      # Beide Validatoren, die `./arasul bootstrap` aufruft und bei deren
      # Fehlschlag er mit exit 1 abbricht (arasul, Schritt 5). Bis zum
      # 28.08.2026 hat sie nie jemand gegen eine frisch erzeugte `.env`
      # laufen lassen -- der eine suchte seine Compose-Datei im falschen
      # Verzeichnis, und das fiel erst am Geraet auf.
      - name: Der Konfigurations-Validator ist mit der frischen .env zufrieden
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: bash scripts/validate/validate-config.sh

      - name: Der Abhaengigkeits-Validator findet seine Compose-Datei
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: bash scripts/validate/validate-dependencies.sh

      # `config` liest die `.env` und alle sechs Compose-Dateien, startet aber
      # nichts. Jede Zeile auf stderr ist eine Warnung; die haeufigste war
      # "The dvbE0IB... variable is not set" -- ein bcrypt-Hash mit `$`.
      - name: docker compose liest die Konfiguration ohne Warnung
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: |
          set -eu
          meckern=$(docker compose config -q 2>&1 >/dev/null || true)
          if [ -n "$meckern" ]; then
            echo "docker compose meldet beim Lesen der Konfiguration:" >&2
            echo "$meckern" >&2
            exit 1
          fi
          echo "Keine Warnung."

      # Die beiden Geheimnisse einer Installation -- Startpasswort und
      # Kit-Schluessel -- gibt es genau einmal. Am 28.08.2026 hing ihre Ausgabe
      # am gruenen Rauchtest; der Rauchtest war rot, weil er nicht wartete, und
      # der Kit-Schluessel war angelegt und hat ihn nie jemand gesehen. Hier
      # laeuft genau das Skript, das der Bootstrap am Ende ruft.
      - name: Die Erstausgabe nennt beide Geheimnisse und legt sie ab
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: |
          set -eu
          ziel=config/secrets/erstausgabe.txt
          ausgabe=$(bash scripts/util/erstausgabe.sh \
            --passwort 'AbnahmeCi2026x' --schluessel 'aras_abnahmeci')
          echo "$ausgabe"
          for geheimnis in AbnahmeCi2026x aras_abnahmeci; do
            grep -q "$geheimnis" <<<"$ausgabe" ||
              { echo "Die Konsolenausgabe nennt $geheimnis nicht." >&2; exit 1; }
            grep -q "$geheimnis" "$ziel" ||
              { echo "$ziel nennt $geheimnis nicht." >&2; exit 1; }
          done
          rechte=$(stat -c '%a' "$ziel")
          [ "$rechte" = "600" ] || { echo "$ziel hat Rechte $rechte statt 600." >&2; exit 1; }
          grep -qi 'LOESCHEN' "$ziel" ||
            { echo "$ziel sagt nicht, dass sie zu loeschen ist." >&2; exit 1; }
          rm -f "$ziel"

      # Abschnitt 8 darin misst, dass der Rauchtest je Dienst wartet und dass
      # die Erstausgabe VOR dem Fehlerbericht steht -- also auch dann erscheint,
      # wenn der Rauchtest rot ist.
      - name: Abnahme des Bootstraps (trocken)
        working-directory: ${{ steps.auspacken.outputs.wurzel }}
        run: bash scripts/test/bootstrap-abnahme.sh --trocken

      # ------------------------------------------------------------------
      # Und der zweite Zug: das Artefakt AKTUALISIERT (29.08.2026).
      #
      # Die Schritte darueber messen eine Erstinstallation. Bis zum 29.08.2026
      # war das alles, was gemessen wurde -- und der Weg von einer Fassung auf
      # die naechste hatte gar keinen Messpunkt. Am Orin fiel am 28.08. auf,
      # was daraus folgte: ohne `.env` erzeugte `interactive_setup.sh`
      # bedingungslos neue Geheimnisse, waehrend der feste Projektname
      # dieselben Volumes uebernahm. Alte Datenbank, neues Passwort, und die
      # Geraete-CA, `data/apps`, Flows und Sicherungen blieben im alten Ordner
      # liegen.
      #
      # Gemessen wird deshalb der ganze Weg: Artefakt A installieren, Zustand
      # anlegen, Artefakt B darueber, Zustand nachzaehlen. Der Lauf am Orin
      # folgt, wenn der Dauerlauf A7 durch ist; alles daran, was ohne
      # Jetson-Hardware messbar ist, laeuft hier bei jedem Zug.
      #
      # Eigener Ordner, eigener Projektname, eigener Zeiger: die Abnahme baut
      # ihre Artefakte selbst und fasst nichts an, was schon auf dem Laeufer
      # liegt.
      - name: Abnahme der Aktualisierung (Artefakt ueber Artefakt)
        run: bash scripts/test/aktualisierung-abnahme.sh

  # ----------------------------------------------------------------------------
  # Toter Code im Frontend (Phase B3 des Ueberordner-Plans vom 26.08.2026).
  # knip findet, was toter-code.sh nicht sieht: einzelne ungenutzte Exporte in
  # einer sonst genutzten Datei, ungenutzte Abhaengigkeiten, doppelte Exporte.
  # Der Job ist rot, sobald knip EINEN Befund hat; Ausnahmen stehen in
  # apps/dashboard-frontend/knip.json.
  #
  # ER SIEHT DIE BIBLIOTHEK NICHT (Phase H3, 29.08.2026). knip laeuft aus
  # apps/dashboard-frontend/ und kommt ueber dessen Wurzel nicht hinaus;
  # packages/marken/ haengt an einem Vite-Alias und ist kein npm-Paket. Seit
  # H3 stehen die Primitive dort, und damit auch die vier Pakete, die sie
  # brauchen (radix-ui, class-variance-authority, clsx, tailwind-merge) --
  # sie stehen deshalb in ignoreDependencies, obwohl sie benutzt werden.
  # Toten Code IN der Bibliothek faengt scripts/test/marken.py (jeder Name
  # genau einmal, jede Klasse mit Regel) und bausteine.py (jedes Primitiv auf
  # der Schauseite).
  # ----------------------------------------------------------------------------
  dead-code:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: knip (frontend)
        working-directory: apps/dashboard-frontend
        run: npm run knip

  # ----------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        backend,
        frontend,
        docker-build,
        migrationen,
        python-services,
        lockfile-guard,
        guards,
        dead-code,
        installation,
      ]
    if: always()
    steps:
      - name: Aggregate results
        env:
          # Eine Liste statt einer von Hand gepflegten Zeichenkette. Zweimal ist
          # hier ein Job aus dem Vergleich gefallen, ohne dass es auffiel:
          # python-services stand nur in `needs`, guards kam am 20.08.2026 neu
          # dazu. Jeder Job steht jetzt genau einmal, in einer Zeile, und wer
          # einen vergisst, sieht die Luecke statt sie in einer Kette aus
          # Bindestrichen zu uebersehen.
          ERGEBNISSE: |
            Pfadpruefung=${{ needs.changes.result }}
            Backend=${{ needs.backend.result }}
            Frontend=${{ needs.frontend.result }}
            Docker=${{ needs.docker-build.result }}
            Migrationen=${{ needs.migrationen.result }}
            Python=${{ needs.python-services.result }}
            Lockfile=${{ needs.lockfile-guard.result }}
            Guards=${{ needs.guards.result }}
            DeadCode=${{ needs.dead-code.result }}
            Installation=${{ needs.installation.result }}
        run: |
          fehler=0
          while IFS='=' read -r name ergebnis; do
            [ -z "$name" ] && continue
            # Nur Docker darf uebersprungen werden. Diese Bedingung prueft die
            # Pfadpruefung NICHT mit, sie laesst `skipped` bedingungslos durch.
            # Abgesichert ist der Fall trotzdem, aber woanders: `Pfadpruefung`
            # steht als eigene Zeile in derselben Liste. Faellt der Filter aus,
            # wird docker-build ueber `needs` ohnehin uebersprungen, und die
            # Pfadpruefungszeile setzt fehler=1. Wer hier etwas aendert, darf
            # sich also nicht auf eine Reihenfolge verlassen, die dieser Block
            # gar nicht erzwingt. Aus der Review von #454.
            if [ "$name" = "Docker" ] && [ "$ergebnis" = "skipped" ]; then
              printf '%-13s %s (keine betroffenen Pfade)\n' "$name" "$ergebnis"
              continue
            fi
            printf '%-13s %s\n' "$name" "$ergebnis"
            [ "$ergebnis" = "success" ] || fehler=1
          done <<< "$ERGEBNISSE"
          if [ "$fehler" = "1" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
