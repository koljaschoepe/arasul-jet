name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend: lint + full Jest suite (coverage thresholds enforced via
  # package.json). Runs from the monorepo root so `file:` workspace deps to
  # @arasul/shared-schemas resolve correctly.
  # ----------------------------------------------------------------------------
  backend:
    name: Backend (lint + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint (backend)
        run: npm run lint:backend

      - name: Jest (with coverage)
        working-directory: apps/dashboard-backend
        run: npx jest --coverage --maxWorkers=2

      # Advisory: reports high/critical vulnerabilities so they show up in the
      # Actions summary without blocking the pipeline. Run from workspace root
      # so the single root lockfile is audited once per CI run.
      - name: npm audit (advisory)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/dashboard-backend/coverage/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Frontend: lint + vitest. Same workspace-root install strategy as backend.
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Diese drei Schritte liefen bis zum 20.08.2026 mit `continue-on-error`,
      # weil ein Altbestand von rund 1500 Lint-Meldungen, 580 Typfehlern und 90
      # roten Komponententests abgearbeitet werden sollte. Der Altbestand ist
      # weg. Am 20.08.2026 auf `main` gemessen: tsc 0 Fehler, ESLint 0 Fehler,
      # Vitest 915 von 915 gruen.
      #
      # Solange der Schalter stand, war das gruene Haekchen an diesem Job eine
      # Aussage ueber gar nichts: er meldete auch dann Erfolg, wenn jeder Test
      # rot war. Wer ihn wieder auf `true` setzt, macht die Pipeline erneut
      # stumm und muss dazuschreiben, welche Zahl er gemessen hat.
      - name: Typecheck (frontend, tsc)
        working-directory: apps/dashboard-frontend
        run: npx tsc --noEmit

      - name: Lint (frontend)
        run: npm run lint:frontend

      - name: Vitest (with coverage)
        working-directory: apps/dashboard-frontend
        run: npx vitest run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/dashboard-frontend/coverage/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Docker build smoke — each image must at least build. No full-stack run.
  # Backend uses the multi-stage 'test' target so test deps + tests are
  # exercised by the build itself.
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker build · ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: dashboard-backend
            dockerfile: apps/dashboard-backend/Dockerfile
            context: .
            target: runtime
          - name: dashboard-backend-test
            dockerfile: apps/dashboard-backend/Dockerfile
            context: .
            target: test
          - name: dashboard-frontend
            dockerfile: apps/dashboard-frontend/Dockerfile
            context: .
          - name: metrics-collector
            dockerfile: services/metrics-collector/Dockerfile
            context: .
          - name: self-healing-agent
            dockerfile: services/self-healing-agent/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  # ----------------------------------------------------------------------------
  # Lockfile drift guard (Master-Plan P9-4 / AC2): the repo keeps a single
  # ROOT package-lock.json. `npm ci` from root must install every workspace
  # cleanly — it errors if a package.json bump landed without updating the root
  # lock, the exact drift that broke main on 2026-05-05. This directly tests the
  # failure mode (and is robust to npm-version canonical-form differences that a
  # byte-exact `--package-lock-only` diff would false-positive on).
  # ----------------------------------------------------------------------------
  lockfile-guard:
    name: Lockfile drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Root lock must install cleanly (npm ci)
        run: npm ci --ignore-scripts

  # ----------------------------------------------------------------------------
  # Python services: non-blocking pytest. Some services have no tests yet.
  # ----------------------------------------------------------------------------
  python-services:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [metrics-collector, self-healing-agent, document-indexer]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          # document-indexer: seine Tests stubben die schweren Abhaengigkeiten
          # (PyMuPDF, spacy, qdrant-client, psycopg2, …) selbst und laufen
          # bewusst in einer nackten Umgebung. Sie zu installieren waere nur
          # ein paar Minuten CI-Zeit fuer nichts.
          if [ "${{ matrix.service }}" != "document-indexer" ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov pytest-mock || true
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run pytest (green if a service has no tests yet)
        working-directory: services/${{ matrix.service }}
        env:
          # `libs/shared-python` (structured_logging & Co.) kopieren die
          # Dockerfiles ins Image. Im CI-Checkout liegt es daneben statt darin,
          # deshalb hier auf den Pfad — sonst scheitert der Import und der
          # Testlauf bricht schon beim Einsammeln ab.
          PYTHONPATH: ${{ github.workspace }}/libs/shared-python
        run: |
          # Frueher: `pytest … || echo "…"`. Das schluckte AUCH echte
          # Fehlschlaege — der Job blieb gruen, egal was passierte. So fiel
          # monatelang nicht auf, dass die document-indexer-Tests sich nicht
          # einmal mehr einsammeln liessen. Jetzt wird nur der Fall
          # „keine Tests gefunden" (pytest-Exitcode 5) durchgewunken.
          set +e
          pytest --cov=. --cov-report=xml
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "Keine Tests in diesem Service — ok."
            exit 0
          fi
          exit "$code"

  # ----------------------------------------------------------------------------
  # Summary: aggregate pass/fail so branch protection can require a single
  # check instead of listing every matrix cell.
  # ----------------------------------------------------------------------------
  # Waechter: die vier Pruefungen, die bis zum 20.08.2026 NUR in
  # scripts/test/run-tests.sh liefen, also nur dann, wenn jemand sie von Hand
  # aufrief. Genau das ist der Weg, auf dem technische Schuld zurueckkommt:
  # ein Zug, der die Hooks umgeht (Weboberflaeche, --no-verify, ein Workflow,
  # der selbst committet), hat sie nie gesehen. Alle vier laufen in Sekunden,
  # nur der Tote-Code-Lauf braucht knapp eine Minute.
  # ----------------------------------------------------------------------------
  guards:
    name: Guards (Design, toter Code, Bausteine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Baustein-Set (Plan 023 C1, C2)
        run: python3 scripts/test/bausteine.py --pfad .

      - name: Gedankenstriche als Trenner
        run: python3 scripts/test/gedankenstriche.py --pfad .

      - name: Design-System (Farben, Variablen)
        run: node scripts/test/check-design-system.js

      - name: Code-Qualitaet (hartkodierte URLs)
        run: node scripts/test/check-code-quality.js

      - name: Toter Code (Plan 023 B3)
        run: bash scripts/test/toter-code.sh

  # ----------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build, python-services, lockfile-guard, guards]
    if: always()
    steps:
      - name: Aggregate results
        env:
          # Eine Liste statt einer von Hand gepflegten Zeichenkette. Zweimal ist
          # hier ein Job aus dem Vergleich gefallen, ohne dass es auffiel:
          # python-services stand nur in `needs`, guards kam am 20.08.2026 neu
          # dazu. Jeder Job steht jetzt genau einmal, in einer Zeile, und wer
          # einen vergisst, sieht die Luecke statt sie in einer Kette aus
          # Bindestrichen zu uebersehen.
          ERGEBNISSE: |
            Backend=${{ needs.backend.result }}
            Frontend=${{ needs.frontend.result }}
            Docker=${{ needs.docker-build.result }}
            Python=${{ needs.python-services.result }}
            Lockfile=${{ needs.lockfile-guard.result }}
            Guards=${{ needs.guards.result }}
        run: |
          fehler=0
          while IFS='=' read -r name ergebnis; do
            [ -z "$name" ] && continue
            printf '%-10s %s\n' "$name" "$ergebnis"
            [ "$ergebnis" = "success" ] || fehler=1
          done <<< "$ERGEBNISSE"
          if [ "$fehler" = "1" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
