name: CI

# Reine Dokumentation loest keinen Lauf aus. Die Sperre sitzt bewusst hier am
# AUSLOESER und nicht als `if:` an den einzelnen Jobs: GitHub laesst einen
# Pflicht-Check, dessen ganzer Workflow durch `paths-ignore` uebersprungen
# wurde, automatisch als erfuellt durchgehen. Ein uebersprungener EINZELJOB
# bekommt diese Behandlung NICHT und wuerde einen reinen Doku-PR fuer immer
# blockieren.
#
# WER BRANCH-SCHUTZ EINSCHALTET, muss das vorher einmal echt ausprobieren:
# einen PR aufmachen, der nur eine .md-Datei aendert, und nachsehen, ob der
# Merge-Knopf freigegeben wird. Ein falscher Griff faellt hier nicht auf, er
# blockiert lautlos. Stand 21.08.2026 hat dieses Repo weder Branch-Schutz noch
# Rulesets, nachgemessen ueber die API. P9-3 im Master-Plan verlangt aber, "CI
# Summary" zum Pflicht-Check zu machen, also wird der Fall kommen.
on:
  push:
    branches: [main]
    paths-ignore: &nur_doku
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *nur_doku

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Welche Pfade sind betroffen. Grund: am 21.08.2026 gemessen, dass 26 von 135
  # Commits reine Dokumentation waren und trotzdem alle dreizehn Jobs samt
  # fuenf Docker-Bauten ausgeloest haben. Die grobe Sperre dafuer ist
  # `paths-ignore` oben; dieser Job entscheidet zusaetzlich, ob die Bauten
  # ueberhaupt noetig sind.
  #
  # `packages/` und `libs/` stehen mit im Filter, weil die Dockerfiles
  # `packages/shared-schemas` und `libs/shared-python/structured_logging.py` in
  # die Images kopieren. Beim ersten Entwurf fehlten sie, und eine Aenderung nur
  # dort haette den Bau stillschweigend uebersprungen.
  #
  # IM ZWEIFEL WIRD GEBAUT. Ein Filter, der faelschlich ueberspringt, ist genau
  # das stille Loch, das dieser Datei schon zweimal passiert ist. Ein Filter,
  # der zu oft baut, kostet nur Zeit.
  # ----------------------------------------------------------------------------
  changes:
    name: Betroffene Pfade
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.pruefen.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pruefen
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SPITZE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          bauen() { echo "docker=true" >> "$GITHUB_OUTPUT"; echo "Ergebnis: bauen"; exit 0; }
          if [ -z "${BASIS}" ] || [ "${BASIS}" = "0000000000000000000000000000000000000000" ]; then
            echo "Keine belastbare Vergleichsbasis."; bauen
          fi
          if ! git cat-file -e "${BASIS}^{commit}" 2>/dev/null; then
            echo "Basis ${BASIS} liegt nicht im Klon."; bauen
          fi
          geaendert=$(git diff --name-only "${BASIS}" "${SPITZE}") || bauen
          echo "Geaenderte Dateien:"; echo "${geaendert}" | sed 's/^/  /'
          if printf '%s\n' "${geaendert}" | grep -qE '^(apps/|services/|packages/|libs/|\.github/workflows/)|(^|/)Dockerfile|(^|/)\.dockerignore$|^package(-lock)?\.json$'; then
            echo "Docker-relevante Pfade betroffen."; bauen
          fi
          echo "docker=false" >> "$GITHUB_OUTPUT"
          echo "Ergebnis: ueberspringen"

  # ----------------------------------------------------------------------------
  # Backend: lint + full Jest suite (coverage thresholds enforced via
  # package.json). Runs from the monorepo root so `file:` workspace deps to
  # @arasul/shared-schemas resolve correctly.
  # ----------------------------------------------------------------------------
  backend:
    name: Backend (lint + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint (backend)
        run: npm run lint:backend

      - name: Jest (with coverage)
        working-directory: apps/dashboard-backend
        run: npx jest --coverage --maxWorkers=2

      # Advisory: reports high/critical vulnerabilities so they show up in the
      # Actions summary without blocking the pipeline. Run from workspace root
      # so the single root lockfile is audited once per CI run.
      - name: npm audit (advisory)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/dashboard-backend/coverage/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Frontend: lint + vitest. Same workspace-root install strategy as backend.
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Diese drei Schritte liefen bis zum 20.08.2026 mit `continue-on-error`,
      # weil ein Altbestand von rund 1500 Lint-Meldungen, 580 Typfehlern und 90
      # roten Komponententests abgearbeitet werden sollte. Der Altbestand ist
      # weg. Am 20.08.2026 auf `main` gemessen: tsc 0 Fehler, ESLint 0 Fehler,
      # Vitest 915 von 915 gruen.
      #
      # Solange der Schalter stand, war das gruene Haekchen an diesem Job eine
      # Aussage ueber gar nichts: er meldete auch dann Erfolg, wenn jeder Test
      # rot war. Wer ihn wieder auf `true` setzt, macht die Pipeline erneut
      # stumm und muss dazuschreiben, welche Zahl er gemessen hat.
      - name: Typecheck (frontend, tsc)
        working-directory: apps/dashboard-frontend
        run: npx tsc --noEmit

      - name: Lint (frontend)
        run: npm run lint:frontend

      - name: Vitest (with coverage)
        working-directory: apps/dashboard-frontend
        run: npx vitest run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/dashboard-frontend/coverage/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Docker build smoke — each image must at least build. No full-stack run.
  # Backend uses the multi-stage 'test' target so test deps + tests are
  # exercised by the build itself.
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker build · ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: dashboard-backend
            dockerfile: apps/dashboard-backend/Dockerfile
            context: .
            target: runtime
          - name: dashboard-backend-test
            dockerfile: apps/dashboard-backend/Dockerfile
            context: .
            target: test
          - name: dashboard-frontend
            dockerfile: apps/dashboard-frontend/Dockerfile
            context: .
          - name: metrics-collector
            dockerfile: services/metrics-collector/Dockerfile
            context: .
          - name: self-healing-agent
            dockerfile: services/self-healing-agent/Dockerfile
            context: .
          # Der Indexer stand hier bis zum 24.08.2026 nicht drin, und seine
          # Requirements werden im pytest-Job bewusst nicht installiert (siehe
          # dort). Damit war er der einzige Dienst, dessen Abhaengigkeiten in
          # keinem einzigen CI-Job je echt aufgeloest wurden. #671 hob
          # qdrant-client auf >=1.19 an, wo `NamedVector` nicht mehr existiert,
          # die CI blieb gruen, und der Fehler schlug erst Tage spaeter beim
          # ersten Neubau auf dem Geraet zu — als zwei gescheiterte Deploys.
          - name: document-indexer
            dockerfile: services/document-indexer/Dockerfile
            context: .
            # Bauen allein haette #685 NICHT gefunden: das Image baut sauber,
            # der ImportError kommt erst, wenn der Prozess startet.
            smoke: import api_server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: false
          platforms: linux/amd64
          # Nur wo eine Startprobe folgt, muss das Image auch im lokalen Daemon
          # landen. `load` kostet Zeit, deshalb nicht fuer alle.
          load: ${{ matrix.image.smoke != '' }}
          tags: ${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Startprobe
        if: matrix.image.smoke != ''
        env:
          BILD: ${{ matrix.image.name }}:ci
          SMOKE: ${{ matrix.image.smoke }}
        # Ohne Netz und ohne Secrets: geprueft wird ausschliesslich, ob der
        # Prozess seine Importe aufloest. Alles, was danach kommt (Datenbank,
        # MinIO), gehoert nicht hierher und wuerde nur falsche Alarme erzeugen.
        run: docker run --rm --network none "$BILD" python3 -c "$SMOKE"

  # ----------------------------------------------------------------------------
  # Lockfile drift guard (Master-Plan P9-4 / AC2): the repo keeps a single
  # ROOT package-lock.json. `npm ci` from root must install every workspace
  # cleanly — it errors if a package.json bump landed without updating the root
  # lock, the exact drift that broke main on 2026-05-05. This directly tests the
  # failure mode (and is robust to npm-version canonical-form differences that a
  # byte-exact `--package-lock-only` diff would false-positive on).
  # ----------------------------------------------------------------------------
  lockfile-guard:
    name: Lockfile drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Root lock must install cleanly (npm ci)
        run: npm ci --ignore-scripts

  # ----------------------------------------------------------------------------
  # Python services: non-blocking pytest. Some services have no tests yet.
  # ----------------------------------------------------------------------------
  python-services:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [metrics-collector, self-healing-agent, document-indexer]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          # document-indexer: seine Tests stubben die schweren Abhaengigkeiten
          # (PyMuPDF, spacy, qdrant-client, psycopg2, …) selbst und laufen
          # bewusst in einer nackten Umgebung. Sie zu installieren waere nur
          # ein paar Minuten CI-Zeit fuer nichts.
          #
          # Der Satz stimmt fuer die Tests, aber er hat ein Loch hinterlassen:
          # bis zum 24.08.2026 war das der EINZIGE Ort, an dem die Requirements
          # des Indexers haetten aufgeloest werden koennen — und weil es hier
          # nicht passiert, wurde eine kaputte Versionsanhebung (#671) gruen
          # durchgewunken. Geschlossen wird das jetzt nicht hier, sondern in
          # der Startprobe des docker-build-Jobs, wo es hingehoert: dort laeuft
          # das echte Image mit den echten Paketen.
          if [ "${{ matrix.service }}" != "document-indexer" ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov pytest-mock || true
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run pytest (green if a service has no tests yet)
        working-directory: services/${{ matrix.service }}
        env:
          # `libs/shared-python` (structured_logging & Co.) kopieren die
          # Dockerfiles ins Image. Im CI-Checkout liegt es daneben statt darin,
          # deshalb hier auf den Pfad — sonst scheitert der Import und der
          # Testlauf bricht schon beim Einsammeln ab.
          PYTHONPATH: ${{ github.workspace }}/libs/shared-python
        run: |
          # Frueher: `pytest … || echo "…"`. Das schluckte AUCH echte
          # Fehlschlaege — der Job blieb gruen, egal was passierte. So fiel
          # monatelang nicht auf, dass die document-indexer-Tests sich nicht
          # einmal mehr einsammeln liessen. Jetzt wird nur der Fall
          # „keine Tests gefunden" (pytest-Exitcode 5) durchgewunken.
          set +e
          pytest --cov=. --cov-report=xml
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "Keine Tests in diesem Service — ok."
            exit 0
          fi
          exit "$code"

  # ----------------------------------------------------------------------------
  # Summary: aggregate pass/fail so branch protection can require a single
  # check instead of listing every matrix cell.
  # ----------------------------------------------------------------------------
  # Waechter: die vier Pruefungen, die bis zum 20.08.2026 NUR in
  # scripts/test/run-tests.sh liefen, also nur dann, wenn jemand sie von Hand
  # aufrief. Genau das ist der Weg, auf dem technische Schuld zurueckkommt:
  # ein Zug, der die Hooks umgeht (Weboberflaeche, --no-verify, ein Workflow,
  # der selbst committet), hat sie nie gesehen. Alle vier laufen in Sekunden,
  # nur der Tote-Code-Lauf braucht knapp eine Minute.
  # ----------------------------------------------------------------------------
  guards:
    name: Guards (Design, toter Code, Bausteine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Baustein-Set (Plan 023 C1, C2)
        run: python3 scripts/test/bausteine.py --pfad .

      - name: Namensregister (Plan 023 D1)
        run: python3 scripts/test/modellnamen.py --pfad .

      - name: Einheiten (Plan 023 D4)
        run: python3 scripts/test/einheiten.py --pfad .

      - name: Gedankenstriche als Trenner
        run: python3 scripts/test/gedankenstriche.py --pfad .

      - name: Design-System (Farben, Variablen)
        run: node scripts/test/check-design-system.js

      - name: Code-Qualitaet (hartkodierte URLs)
        run: node scripts/test/check-code-quality.js

      - name: Der Faden (hoechstens ein Plan in docs/plans/active)
        run: python3 scripts/test/plan-faden.py --pfad .

      - name: Pfadfilter deckt die Kopierquellen ab (aus der Review von #454)
        run: python3 scripts/test/pfadfilter.py --pfad .

      - name: Durchreichung der Stellschrauben (Plan 023 E1)
        run: python3 scripts/test/durchreichung.py --wurzel .

      - name: Datenordner werden vorher angelegt (Plan 023 H1)
        run: python3 scripts/test/datenordner.py --wurzel .

      - name: Jede Tabelle ist im Werksreset eingeordnet (Plan 023 B5)
        run: python3 scripts/test/werksreset-tabellen.py --wurzel .

      # Diese drei liefen bisher nur in `run-tests.sh`, also nur lokal. Ein Zug
      # ueber die Weboberflaeche, mit `--no-verify` oder aus einem Workflow
      # heraus hat sie nie gesehen — und genau das ist der Weg, auf dem die
      # Schuldenliste der undokumentierten Endpunkte still wieder wachsen
      # koennte. Sie steht seit dem 23.08.2026 bei null (Plan 023 K1) und soll
      # dort bleiben.
      - name: Jeder Endpunkt hat eine Beschreibung (Plan 023 K1)
        run: python3 scripts/test/endpunkte.py --wurzel .

      - name: Anleitungen zeigen nichts, was es nicht gibt (Plan 023 K3)
        run: python3 scripts/test/anleitungen.py

      - name: Stiller Tod (Zuweisungen, die ein Skript wortlos beenden)
        run: python3 scripts/test/stiller-tod.py --wurzel .

      - name: Routenregeln (asyncHandler, keine nackten Fehler)
        run: python3 scripts/test/routenregeln.py --wurzel .

      - name: Der Deploy-Rollback sagt die Wahrheit ueber sich
        run: bash scripts/test/rollback-meldung.sh

      - name: Selbsttest der Waechter
        run: bash scripts/test/waechter-selbsttest.sh

      - name: Toter Code (Plan 023 B3)
        run: bash scripts/test/toter-code.sh

  # ----------------------------------------------------------------------------
  # Toter Code im Frontend (Phase B3 des Ueberordner-Plans vom 26.08.2026).
  # knip findet, was toter-code.sh nicht sieht: einzelne ungenutzte Exporte in
  # einer sonst genutzten Datei, ungenutzte Abhaengigkeiten, doppelte Exporte.
  # Der Job ist rot, sobald knip EINEN Befund hat; Ausnahmen stehen mit Grund
  # in apps/dashboard-frontend/knip.json.
  # ----------------------------------------------------------------------------
  dead-code:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: knip (frontend)
        working-directory: apps/dashboard-frontend
        run: npm run knip

  # ----------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [changes, backend, frontend, docker-build, python-services, lockfile-guard, guards, dead-code]
    if: always()
    steps:
      - name: Aggregate results
        env:
          # Eine Liste statt einer von Hand gepflegten Zeichenkette. Zweimal ist
          # hier ein Job aus dem Vergleich gefallen, ohne dass es auffiel:
          # python-services stand nur in `needs`, guards kam am 20.08.2026 neu
          # dazu. Jeder Job steht jetzt genau einmal, in einer Zeile, und wer
          # einen vergisst, sieht die Luecke statt sie in einer Kette aus
          # Bindestrichen zu uebersehen.
          ERGEBNISSE: |
            Pfadpruefung=${{ needs.changes.result }}
            Backend=${{ needs.backend.result }}
            Frontend=${{ needs.frontend.result }}
            Docker=${{ needs.docker-build.result }}
            Python=${{ needs.python-services.result }}
            Lockfile=${{ needs.lockfile-guard.result }}
            Guards=${{ needs.guards.result }}
            DeadCode=${{ needs.dead-code.result }}
        run: |
          fehler=0
          while IFS='=' read -r name ergebnis; do
            [ -z "$name" ] && continue
            # Nur Docker darf uebersprungen werden. Diese Bedingung prueft die
            # Pfadpruefung NICHT mit, sie laesst `skipped` bedingungslos durch.
            # Abgesichert ist der Fall trotzdem, aber woanders: `Pfadpruefung`
            # steht als eigene Zeile in derselben Liste. Faellt der Filter aus,
            # wird docker-build ueber `needs` ohnehin uebersprungen, und die
            # Pfadpruefungszeile setzt fehler=1. Wer hier etwas aendert, darf
            # sich also nicht auf eine Reihenfolge verlassen, die dieser Block
            # gar nicht erzwingt. Aus der Review von #454.
            if [ "$name" = "Docker" ] && [ "$ergebnis" = "skipped" ]; then
              printf '%-13s %s (keine betroffenen Pfade)\n' "$name" "$ergebnis"
              continue
            fi
            printf '%-13s %s\n' "$name" "$ergebnis"
            [ "$ergebnis" = "success" ] || fehler=1
          done <<< "$ERGEBNISSE"
          if [ "$fehler" = "1" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
