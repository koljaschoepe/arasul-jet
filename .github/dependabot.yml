# Dependabot configuration for Arasul Platform
# Automatically creates PRs for dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # All Node workspaces (root devDeps + apps/dashboard-{backend,frontend} +
  # packages/*) share ONE root package-lock.json — the root-only lockfile
  # strategy (Master-Plan P9-4). A SINGLE npm entry at '/' regenerates that one
  # lock for every bump, so `npm ci` from root stays in sync after a merge.
  # Do NOT re-add per-workspace npm entries: they update a workspace
  # package.json without touching the root lock and break main (2026-05-05).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      express:
        patterns:
          - 'express*'
          - 'body-parser'
          - 'cors'
      security:
        patterns:
          - 'jsonwebtoken'
          - 'bcrypt*'
          - 'helmet'
      testing:
        patterns:
          - 'jest*'
          - 'supertest'
      react:
        patterns:
          - 'react*'
          - '@testing-library/*'
      visualization:
        patterns:
          - 'recharts'
          - 'mermaid'
      # tiptap gehoert zusammen. Am 24.08.2026 lagen drei einzelne PRs offen
      # (@tiptap/core, @tiptap/react, @tiptap/extension-character-count, alle
      # 3.30.1 auf 3.30.2), und alle drei waren rot mit demselben Fehler:
      #
      #   SlashCommands.tsx(32,49): error TS2339: Property 'setParagraph'
      #   does not exist on type 'ChainedCommands'.
      #
      # Die Befehle kommen aus `starter-kit`. Wird ein Paket allein
      # angehoben, passen die Typen der Kette nicht mehr zusammen. Einzeln
      # koennen diese PRs also gar nicht gruen werden — sie liefen jede Woche
      # neu auf und blieben liegen.
      tiptap:
        patterns:
          - '@tiptap/*'

  # n8n Custom Nodes
  - package-ecosystem: 'npm'
    directory: '/services/n8n/custom-nodes/n8n-nodes-arasul-llm'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'npm'
      - 'n8n'
    commit-message:
      prefix: 'chore(deps-n8n)'

  - package-ecosystem: 'npm'
    directory: '/services/n8n/custom-nodes/n8n-nodes-arasul-embeddings'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'npm'
      - 'n8n'
    commit-message:
      prefix: 'chore(deps-n8n)'

  # Python services (pip)
  - package-ecosystem: 'pip'
    directory: '/services/metrics-collector'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore(deps-python)'

  - package-ecosystem: 'pip'
    directory: '/services/self-healing-agent'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    open-pull-requests-limit: 3
    labels:
