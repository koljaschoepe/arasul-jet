server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (aligned with backend 50MB limit)
    client_max_body_size 55m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so new builds are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Die Bibliothek zur Laufzeit: `/marken/<haupt>/` (packages/marken/laufzeit.config.mjs).
    #
    # Eine App laedt von hier Bausteine, Muster, Tokens und das fertige
    # Stylesheet, statt eine Kopie mitzubringen. Die festen Namen
    # (`marken.js`, `marken.css`, `react.js` ...) tragen nach einem Update
    # des Geraets neuen Inhalt unter derselben Adresse. Deshalb `no-cache`:
    # der Browser behaelt die Datei, fragt aber jedes Mal mit ETag nach und
    # bekommt ein 304, solange sich nichts geaendert hat. Ein `immutable` wie
    # bei den Assets der Shell hielte eine App bis zu einem Jahr auf der alten
    # Fassung.
    #
    # Die Teile mit Hash im Namen (`teil-<name>-<hash>.js`) aendern sich nie
    # unter ihrem Namen, die darf der Browser fuer immer behalten.
    #
    # `^~`, damit der Asset-Block darunter (Regex, `immutable`) hier nicht
    # greift, und kein Rueckfall auf `index.html`: eine fehlende Datei der
    # Bibliothek ist ein 404, keine Seite der Shell mit Status 200.
    location ^~ /marken/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location ~ ^/marken/[0-9]+/teil-[^/]+\.(js|css)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:;" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
