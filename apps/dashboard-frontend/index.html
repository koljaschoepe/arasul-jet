<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F6F6" />
    <meta name="description" content="Arasul Platform Dashboard - Edge AI Management" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Arasul Platform</title>
    <style>
      /* Minimal pre-CSS-load styles (loading screen only).
         Do NOT add * { margin/padding } here — it's un-layered CSS
         and would override ALL Tailwind @layer utilities. */
      /* Die Farben der Vorgabe (Theme »Hell«, `:root` in index.css). Sie
         stehen hier als Literale, weil dieser Block VOR dem Stylesheet gilt --
         er faerbt genau die Zehntelsekunde zwischen erstem Byte und geladenem
         CSS. Wer sie aendert, aendert sie dort mit. */
      body {
        background: #f6f6f6;
        color: #1a1a1a;
        margin: 0;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 1.5rem;
        /* War #00FF88 -- die verbotene Gruenfarbe des alten Designsystems, auf
           Schwarz gerade noch lesbar und auf der neuen hellen Vorgabe gar
           nicht. `--muted-foreground` des Themes »Hell« (Phase H1). */
        color: #6b6b6b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Kein Theme-Skript mehr (Phase H1). Das Theme gehoert seit H1 dem
         angemeldeten Menschen (`admin_users.theme`) und nicht dem Browser; ein
         Skript hier koennte es also gar nicht kennen, denn wer angemeldet ist,
         sagt erst `GET /api/auth/session`. Ein weisses Aufblitzen entsteht
         daraus nicht: die Seite faengt in der Vorgabe HELL an, und die Shell
         malt ueberhaupt erst, wenn die Sitzungsprobe geantwortet hat
         (`App.tsx` haelt bis dahin den Ladebildschirm). -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading" id="loading-msg">Arasul Platform wird geladen...</div>
    </div>
    <script>
      // Debug: catch ALL errors including ES module errors
      var _errs = [];
      function showErr(msg) {
        _errs.push(msg);
        var el = document.getElementById('loading-msg');
        if (el) {
          el.style.fontSize = '0.9rem';
          el.style.textAlign = 'left';
          el.style.padding = '20px';
          el.style.whiteSpace = 'pre-wrap';
          el.innerHTML = 'Errors:\n' + _errs.join('\n');
        }
      }
      window.onerror = function(msg, url, line) {
        showErr('onerror: ' + msg + ' @ ' + (url||'').split('/').pop() + ':' + line);
      };
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          showErr('Script load failed: ' + (e.target.src || 'inline'));
        } else if (e.target && e.target.tagName === 'LINK') {
          showErr('Link load failed: ' + (e.target.href || ''));
        } else {
          showErr('error event: ' + (e.message || e.error || JSON.stringify(e)));
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        showErr('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason || 'unknown'));
      });
      // Timeout: if React hasn't mounted after 10s, show diagnostic
      setTimeout(function() {
        var root = document.getElementById('root');
        var loading = document.getElementById('loading-msg');
        if (loading && root && root.children.length <= 2) {
          showErr('TIMEOUT: React did not mount after 10s. Errors above (if any) may explain why.');
          // Check if scripts loaded
          var scripts = document.querySelectorAll('script[type=module]');
          scripts.forEach(function(s) { showErr('Module script: ' + s.src); });
        }
      }, 10000);
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
