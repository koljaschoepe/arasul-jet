# Arasul Platform - Docker Compose
# ==============================================================================
name: arasul-platform
# Startup Order (enforced by depends_on in each compose file):
#   1. postgres-db, docker-proxy   (compose.core.yaml)
#   2. llm-service,                (compose.ai.yaml)
#      embedding-service,
#      document-indexer
#   3. metrics-collector            (compose.monitoring.yaml)
#   4. reverse-proxy                (compose.core.yaml)
#   5. dashboard-backend,           (compose.app.yaml)
#      dashboard-frontend
#   6. self-healing-agent,          (compose.monitoring.yaml)
#      backup-service
#
# MinIO, Loki und Promtail sind am 26.08.2026 (Phase B4 des Rueckbaus)
# entfallen: kein Dienst liest mehr aus dem Objektspeicher, die Log-Ansicht
# liest Docker direkt. n8n, n8n-runners und SearXNG sind in Phase B5 (gleicher
# Tag) gefallen; Automationen sind seither Sache der Flows.
#
# Usage:
#   docker compose up -d                              # All services
#   docker compose --profile tunnel up -d             # + Cloudflare Tunnel
#   docker compose up -d dashboard-backend            # Single service
# ==============================================================================

# EIN Eintrag mit einer Liste, nicht sechs Eintraege. Der Unterschied ist keine
# Kosmetik, und er hat am 28.08.2026 die Installation auf einem frischen Geraet
# verhindert.
#
# Sechs getrennte `include`-Eintraege sind fuer Compose sechs eigenstaendige
# Projekte. `compose.secrets.yaml` ergaenzt aber Dienste, die in `core`, `app`
# und `monitoring` definiert sind -- `postgres-db`, `dashboard-backend`,
# `metrics-collector`, `self-healing-agent`, `backup-service` -- und das ist
# dann kein Ueberschreiben, sondern ein Namenskonflikt:
#
#   services.postgres-db conflicts with imported resource
#
# Aeltere Compose-Fassungen haben das stillschweigend zusammengefuehrt, neuere
# lehnen es ab. Auf dem gewachsenen Orin lief es deshalb weiter, auf einem
# frisch aufgesetzten Geraet mit aktuellem Docker brach `docker compose config`
# ab -- und mit ihm der Bootstrap, der den Validator aufruft (arasul:1385).
# Gefunden hat es der CI-Job "Installation", der seit dieser Phase eine
# Installation aus dem Artefakt durchspielt.
#
# In der LISTENFORM ist die erste Datei die Grundlage und jede weitere eine
# Ergaenzung darauf, genau wie bei `-f a -f b`. `compose.secrets.yaml` steht
# deshalb ZULETZT: sie legt sich ueber die anderen und definiert nichts, was
# nicht schon da waere.
include:
  - path:
      - ./compose/compose.core.yaml
      - ./compose/compose.ai.yaml
      - ./compose/compose.app.yaml
      - ./compose/compose.monitoring.yaml
      - ./compose/compose.external.yaml
      - ./compose/compose.secrets.yaml
